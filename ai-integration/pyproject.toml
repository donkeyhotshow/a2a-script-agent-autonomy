[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-integration"
version = "0.1.0"
description = "Local LLM upstream Proxy Service with AI Integration"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "A2A Script Agent Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Flask>=2.3.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "urllib3>=1.26.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "asgiref>=3.7.0,<4.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
simulation = [
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/a2a-script-agent"
Repository = "https://github.com/your-org/a2a-script-agent.git"
Issues = "https://github.com/your-org/a2a-script-agent/issues"

[project.scripts]
ai-proxy = "proxy.__main__:main"

[tool.setuptools]
packages = ["proxy", "proxy.simulation", "proxy.providers"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
proxy = ["templates/*", "static/*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Exploratory human-review suite: `python scripts/run-human-review.py`
addopts = "--ignore=tests/human-review"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true