<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2A Script Agent - macOS Design</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/components/rag-search.css">
    <link rel="stylesheet" href="css/components/terminal-emulator.css">
    <link rel="stylesheet" href="css/progress-indicators.css">
    <link rel="stylesheet" href="css/iphone-imac-enhancements.css">
</head>
<body>
<div id="app" class="app-container mac-window-frame">
    <div id="header-container" class="app-header mac-header-bar">
        <!-- Window Controls -->
        <div class="window-controls mac-window-controls">
            <button class="window-control close mac-window-control" title="Close"></button>
            <button class="window-control minimize mac-window-control" title="Minimize"></button>
            <button class="window-control maximize mac-window-control" title="Maximize"></button>
        </div>
        
        <!-- Header Controls -->
        <div class="header-controls">
            <select id="projectSelect" class="header-select mac-select" aria-label="Project">
                <option value="default">Default Project</option>
                <option value="web">Web Project</option>
                <option value="api">API Project</option>
            </select>
            <select id="simulationSelect" class="header-select mac-select" aria-label="Simulation">
                <option value="init">Init</option>
                <option value="coder">Coder</option>
                <option value="dialog">Dialog</option>
            </select>
        </div>
        
        <!-- Center Area -->
        <div class="header-center">
            <input type="text" id="taskInput" class="header-input mac-input" placeholder="Enter a task..." aria-label="Task input">
            <button id="sendBtn" class="header-btn mac-btn primary" aria-label="Send task">Send</button>
            <button id="stopBtn" class="header-btn mac-btn" aria-label="Stop">Stop</button>
        </div>
        
        <!-- Right Controls -->
        <div class="header-controls">
            <button id="settingsBtn" class="header-btn mac-btn" aria-label="Settings">⚙️</button>
            <button id="projectsBtn" class="header-btn mac-btn" aria-label="Projects">📁</button>
            <button id="notificationsBtn" class="header-btn mac-btn" aria-label="Notifications">🔔</button>
        </div>
    </div>
    
    <main class="app-main app-content-area mac-scrollbar" role="main">
        <p class="app-main-hint mac-system-font">Enter a task above and click Send. Result appears in the panel.</p>
    </main>
    
    <!-- RAG Search Panel -->
    <div id="rag-search-container"></div>
    
    <!-- Terminal Panel -->
    <div id="terminal-container"></div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal mac-panel" style="display: none;">
    <div class="modal-content">
        <div class="modal-header mac-panel-header">
            <h2 class="mac-panel-title">Settings</h2>
            <div class="mac-panel-controls">
                <button class="mac-panel-control-btn" id="closeSettingsModal" aria-label="Close">✕</button>
            </div>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="mac-system-font-semibold">Client API URL</label>
                <input type="text" id="settingsApiUrl" value="/api" placeholder="/api or http://localhost:3001/api" class="form-input mac-input">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn mac-btn" id="cancelSettings">Cancel</button>
            <button class="btn mac-btn primary" id="saveSettings">Save</button>
        </div>
    </div>
</div>

<!-- Projects Modal -->
<div id="projectsModal" class="modal mac-panel" style="display: none;">
    <div class="modal-content">
        <div class="modal-header mac-panel-header">
            <h2 class="mac-panel-title">Projects</h2>
            <div class="mac-panel-controls">
                <button class="mac-panel-control-btn" id="closeProjectsModal" aria-label="Close">✕</button>
            </div>
        </div>
        <div class="modal-body">
            <div class="projects-toolbar">
                <button class="btn mac-btn primary" id="newProjectBtn">+ New Project</button>
            </div>
            <div class="projects-grid mac-scrollbar" id="projectsGrid">
                <div class="loading-indicator">Loading...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn mac-btn" id="cancelProjects">Close</button>
        </div>
    </div>
</div>

<!-- Notifications -->
<div id="notificationsPanel" class="notifications-panel mac-panel" style="display: none;">
    <div class="notifications-header mac-panel-header">
        <span class="mac-panel-title">Notifications</span>
        <div class="mac-panel-controls">
            <button class="mac-panel-control-btn" id="clearNotifications" aria-label="Clear">✕</button>
        </div>
    </div>
    <div class="notifications-list mac-scrollbar" id="notificationsList"></div>
</div>

<script src="js/template-loader.js"></script>
<script src="js/api-integration.js"></script>
<script src="js/session-manager.js"></script>
<script src="js/websocket-client.js"></script>
<script src="js/session-view-model.js"></script>
<script src="js/sse-client.js"></script>
<script src="js/session-sync.js"></script>
<script src="js/progress-indicators.js"></script>
<script src="js/error-handler.js"></script>
<script src="js/file-transfer.js"></script>
<script src="js/rag-search-ui.js"></script>
<script src="js/terminal-emulator.js"></script>
<script src="js/web-api-client.js"></script>
<script src="js/plasticine-ui.js"></script>
<script src="js/plasticine-workflow.js"></script>
<script src="js/task-flow.js"></script>
<script src="js/iphone-imac-interactions.js"></script>
</body>
</html>
