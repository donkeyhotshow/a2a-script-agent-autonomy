<!-- Mini Zones Template - appears on drag -->
<div class="mini-zones" id="miniZones">
    <div class="mini-zone left" data-zone="left" aria-label="Dock to left">
        <span>◀</span>
    </div>
    <div class="mini-zone right" data-zone="right" aria-label="Dock to right">
        <span>▶</span>
    </div>
    <div class="mini-zone bottom" data-zone="bottom" aria-label="Dock to bottom">
        <span>▼</span>
    </div>
</div>
