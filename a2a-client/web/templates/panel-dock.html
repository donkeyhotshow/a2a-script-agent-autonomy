<!-- Panel Dock Template - docked panel containers -->
<div class="pui-dock-container {{dockPosition}}" data-dock="{{dockPosition}}">
    <div class="pui-dock-header">
        <span class="pui-dock-title">{{title}}</span>
        <div class="pui-dock-controls">
            <button class="pui-dock-btn" data-action="minimize" aria-label="Minimize">−</button>
            <button class="pui-dock-btn" data-action="close" aria-label="Close">×</button>
        </div>
    </div>
    <div class="pui-dock-content">
        {{content}}
    </div>
</div>
