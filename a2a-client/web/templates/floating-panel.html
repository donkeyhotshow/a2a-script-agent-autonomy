<!-- Floating Panel Template -->
<div class="floating-panel" data-panel-id="{{panelId}}" data-panel-type="{{panelType}}" data-panel-slot="{{slot}}">
    <div class="panel-header">
        <span class="panel-title">{{ title }}</span>
        <div class="panel-controls">
            <button class="panel-control-btn" data-action="minimize" aria-label="Minimize panel">−</button>
            <button class="panel-control-btn" data-action="expand" aria-label="Expand panel">□</button>
            <button class="panel-control-btn" data-action="close" aria-label="Close panel">×</button>
        </div>
    </div>
    <div class="panel-content">
        {{ content }}
    </div>
    <div class="panel-resize-handle"></div>
</div>
