<!-- Header: task form only -->
<header class="app-header" role="banner">
    <div class="header-left">
        <div class="logo">🤖 A2A Script Agent</div>
        <div class="header-controls">
            <select class="header-select" id="projectSelect">
                <option value="">Select Project...</option>
            </select>
        </div>
    </div>
    <div class="header-center">
        <form class="header-task-form" id="taskSendForm" role="form" aria-label="Send task">
            <input type="text" class="header-input" id="taskInputField" placeholder="Task (from project)…"
                   aria-label="Task" autocomplete="off"/>
            <button type="submit" class="header-btn primary" id="taskSendBtn">Send</button>
        </form>
    </div>
    <div class="header-right">
        <button class="header-btn" id="newTaskBtn">📝 New Task</button>
        <button class="header-btn" id="projectsBtn">📁 Projects</button>
        <button class="header-btn" id="settingsBtn">⚙️ Settings</button>
    </div>
</header>
