<!-- Header: A2A Script Agent - Nebula Theme -->
<header class="app-header" role="banner">
    <div class="header-left">
        <div class="logo">
            <div class="logo-icon">◈</div>
            <span>A2A Script Agent</span>
        </div>
        <div class="header-controls">
            <select class="header-select" id="projectSelect">
                <option value="">Select Project...</option>
            </select>
        </div>
    </div>
    <div class="header-center">
        <!-- Storage mode toggle: project folder vs persistent storage (a2a-client/storage/sessions or A2A_CLIENT_STORAGE_DIR) -->
        <div class="storage-mode-toggle">
            <label class="toggle-label">
                <span class="toggle-text">Storage:</span>
                <select class="header-select storage-select" id="storageModeSelect">
                    <option value="project">Project (.a2a)</option>
                    <option value="storage">Persistent (storage/sessions)</option>
                </select>
            </label>
        </div>
    </div>
    <div class="header-right">
        <!-- Loader indicator (shown when waiting for server response) -->
        <div class="loader-indicator" id="loaderIndicator" style="display: none;">
            <div class="loader-spinner"></div>
            <span class="loader-text">Processing...</span>
        </div>
        <button class="header-btn" id="projectsBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-4-4H5a2 2 0 0 0-2 2z"/>
            </svg>
            Projects
        </button>
        <button class="header-btn" id="settingsBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.22 4.22l4.24 4.24M6.34 6.34L2.1 2.1"/>
            </svg>
            Settings
        </button>
    </div>
</header>
