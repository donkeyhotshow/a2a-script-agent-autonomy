<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2A Debug - VueFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "vue": "https://esm.sh/vue@3.4.0/vue.esm-browser.js",
      "@vue-flow/core": "https://esm.sh/@vue-flow/core@1.48.2",
      "@vue-flow/background": "https://esm.sh/@vue-flow/background@1.3.2",
      "@vue-flow/controls": "https://esm.sh/@vue-flow/controls@1.1.3",
      "@vue-flow/minimap": "https://esm.sh/@vue-flow/minimap@1.5.4"
    }
  }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vue-flow/core@1.48.2/dist/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vue-flow/controls@1.1.3/dist/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vue-flow/minimap@1.5.4/dist/style.css">
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; background: #f8fafc; }
    .header { background: #1e293b; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 18px; }
    .layout { display: flex; height: calc(100vh - 50px); }
    .sidebar { width: 280px; background: white; border-right: 1px solid #e2e8f0; padding: 16px; overflow-y: auto; }
    .section { margin-bottom: 16px; }
    .section label { display: block; font-weight: 600; margin-bottom: 6px; }
    select, input { width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .main { flex: 1; position: relative; }
    .graph { width: 100%; height: 100%; min-height: 500px; background: #f8fafc; }
    .status { padding: 8px 12px; background: #e2e8f0; border-radius: 4px; font-size: 12px; margin-top: 8px; }
    .status.error { background: #fee2e2; color: #dc2626; }
    .status.success { background: #dcfce7; color: #16a34a; }
    .controls { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 4px; }
    .controls button { padding: 6px 12px; background: white; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; }
    .controls button:hover { background: #f1f5f9; }
  </style>
</head>
<body>
  <header class="header">
    <h1>A2A Debug - VueFlow</h1>
    <div id="status"></div>
  </header>
  
  <div class="layout">
    <aside class="sidebar">
      <div class="section">
        <label>Simulation:</label>
        <select id="simSelect">
          <option value="">-- Select --</option>
        </select>
      </div>
      <button class="btn btn-primary" id="loadBtn">Load JSON</button>
      
      <div class="section">
        <label>Or enter path:</label>
        <input type="text" id="jsonPath" placeholder="simulations/demo/graph-data.json">
      </div>
      <button class="btn btn-primary" id="loadPathBtn">Load Path</button>
    </aside>
    
    <main class="main">
      <div class="controls">
        <button id="fitView">Fit</button>
        <button id="zoomIn">+</button>
        <button id="zoomOut">-</button>
      </div>
      <div id="graph" class="graph"></div>
    </main>
  </div>

  <script type="module">
    import { createApp, ref, h, reactive, toRaw } from 'vue';
    import { VueFlow, useVueFlow } from '@vue-flow/core';
    import { Background } from '@vue-flow/background';
    import { Controls } from '@vue-flow/controls';
    import { MiniMap } from '@vue-flow/minimap';
    
    const SIMULATIONS = ['demo', 'pilot', 'fix-vue-imports', 'analyze-full', 'analyze-architecture'];
    
    let vueFlowInstance = null;
    let app = null;
    
    // Create separate refs for reactivity
    const nodes = ref([]);
    const edges = ref([]);
    
    function showStatus(msg, type = 'info') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }
    
    function initSelector() {
      const sel = document.getElementById('simSelect');
      SIMULATIONS.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        sel.appendChild(opt);
      });
    }
    
    function getNodeStyle(type) {
      const colors = {
        task: { background: '#fee2e2', border: '#ef4444' },
        action: { background: '#fef3c7', border: '#f59e0b' },
        result: { background: '#dcfce7', border: '#22c55e' },
        agent: { background: '#f3e8ff', border: '#a855f7' },
        service: { background: '#cffafe', border: '#06b6d4' }
      };
      const style = colors[type] || { background: '#f1f5f9', border: '#94a3b8' };
      return { 
        background: style.background, 
        border: '2px solid ' + style.border,
        borderRadius: '8px',
        padding: '10px',
        fontSize: '12px'
      };
    }
    
    function renderGraph(data) {
      if (!data) return;
      
      console.log('Rendering graph with data:', data);
      
      const newNodes = [];
      const newEdges = [];
      
      let entities = data.entities || data.nodes || [];
      let relations = data.relations || data.edges || [];
      
      if (Array.isArray(data)) {
        entities = data;
      }
      
      entities.forEach((entity, index) => {
        const id = entity.id || entity.name || 'node-' + index;
        const label = entity.label || entity.title || entity.name || id;
        
        newNodes.push({
          id: id,
          label: label,
          position: entity.position || { x: 100 + (index % 4) * 200, y: 100 + Math.floor(index / 4) * 150 },
          type: entity.type || 'default',
          style: getNodeStyle(entity.type),
          data: entity
        });
      });
      
      relations.forEach((rel, index) => {
        const source = rel.from || rel.source || rel.fromId;
        const target = rel.to || rel.target || rel.toId;
        if (source && target) {
          newEdges.push({
            id: 'edge-' + index,
            source: source,
            target: target,
            label: rel.label || rel.type || '',
            type: 'smoothstep',
            animated: true,
            style: { stroke: '#64748b' },
            labelStyle: { fill: '#64748b' }
          });
        }
      });
      
      // Update refs
      nodes.value = newNodes;
      edges.value = newEdges;
      
      console.log('Nodes set to:', newNodes.length);
      console.log('Edges set to:', newEdges.length);
      
      // Wait for Vue to update then fit view
      setTimeout(() => {
        if (vueFlowInstance) {
          console.log('Calling fitView...');
          vueFlowInstance.fitView({ padding: 0.2, duration: 300 });
        } else {
          console.log('No vueFlowInstance');
        }
      }, 500);
    }
    
    async function loadSimulation(simName) {
      if (!simName) {
        showStatus('Please select a simulation', 'error');
        return;
      }
      
      showStatus('Loading ' + simName + '...');
      
      if (simName === 'demo') {
        try {
          const response = await fetch('/simulations/demo/graph-data.json');
          if (!response.ok) throw new Error('Not found');
          const data = await response.json();
          renderGraph(data);
          showStatus('Loaded: demo', 'success');
          return;
        } catch (e) {
          showStatus('Error: ' + e.message, 'error');
          return;
        }
      }
      
      try {
        const response = await fetch(`/simulations/${simName}/1/request.json`);
        if (!response.ok) throw new Error('Not found');
        const data = await response.json();
        renderGraph(data);
        showStatus('Loaded: ' + simName, 'success');
      } catch (e) {
        try {
          const response = await fetch(`/simulations/${simName}/request.json`);
          if (!response.ok) throw new Error('Not found');
          const data = await response.json();
          renderGraph(data);
          showStatus('Loaded: ' + simName, 'success');
        } catch (e2) {
          showStatus('Error: ' + e2.message, 'error');
        }
      }
    }
    
    async function loadFromPath(path) {
      if (!path) {
        showStatus('Enter path', 'error');
        return;
      }
      showStatus('Loading...');
      try {
        const response = await fetch('/' + path);
        if (!response.ok) throw new Error('Not found');
        const data = await response.json();
        renderGraph(data);
        showStatus('Loaded: ' + path, 'success');
      } catch (e) {
        showStatus('Error: ' + e.message, 'error');
      }
    }
    
    function initVueFlow() {
      initSelector();
      
      const container = document.getElementById('graph');
      if (!container) return;
      
      app = createApp({
        components: { VueFlow, Background, Controls, MiniMap },
        setup() {
          // Use useVueFlow composable inside component
          const { fitView: fitViewFn } = useVueFlow();
          
          return { 
            nodes, 
            edges,
            fitView: fitViewFn
          };
        },
        mounted() {
          console.log('Component mounted');
          // Get VueFlow instance after mount
          setTimeout(() => {
            const vfEl = this.$el;
            if (vfEl && vfEl.__vueFlow__) {
              vueFlowInstance = vfEl.__vueFlow__;
              console.log('Got VueFlow instance');
            }
          }, 100);
        },
        render() {
          return h(VueFlow, { 
            nodes: toRaw(this.nodes), 
            edges: toRaw(this.edges),
            fitViewOnInit: true
          }, () => [
            h(Background, { patternColor: '#aaa', gap: 16 }),
            h(Controls),
            h(MiniMap, { nodeColor: '#f8fafc' })
          ]);
        }
      });
      
      app.mount(container);
      console.log('VueFlow initialized');
      
      // Event listeners
      document.getElementById('loadBtn').addEventListener('click', () => {
        const sim = document.getElementById('simSelect').value;
        loadSimulation(sim);
      });
      
      document.getElementById('loadPathBtn').addEventListener('click', () => {
        const path = document.getElementById('jsonPath').value;
        loadFromPath(path);
      });
      
      document.getElementById('fitView').addEventListener('click', () => {
        if (vueFlowInstance) vueFlowInstance.fitView({ padding: 0.2 });
      });
      document.getElementById('zoomIn').addEventListener('click', () => {
        if (vueFlowInstance) vueFlowInstance.zoomIn();
      });
      document.getElementById('zoomOut').addEventListener('click', () => {
        if (vueFlowInstance) vueFlowInstance.zoomOut();
      });
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initVueFlow);
    } else {
      initVueFlow();
    }
  </script>
</body>
</html>
