<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2A Script Agent - Variant 3</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Variant 3 - Floating Panels + Dynamic Sections */
    :root {
      --panel-bg: #1a1a2e;
      --panel-border: #30363d;
      --task-accent: #6366f1;
      --task-success: #22c55e;
      --task-warning: #f97316;
      --task-info: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 48px;
      background: #161b22;
      border-bottom: 1px solid var(--panel-border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-weight: 700;
      font-size: 16px;
      color: var(--task-accent);
    }

    .header-controls {
      display: flex;
      gap: 12px;
    }

    .header-select {
      padding: 6px 12px;
      background: #21262d;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #e6edf3;
      font-size: 12px;
      cursor: pointer;
    }

    .header-select:focus {
      outline: none;
      border-color: var(--task-accent);
    }

    .header-right {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      font-size: 16px;
    }

    .icon-btn:hover {
      background: #21262d;
      color: #e6edf3;
    }

    /* Main Layout */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar - Tasks */
    .tasks-sidebar {
      width: 200px;
      min-width: 200px;
      background: #161b22;
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      color: #8b949e;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .add-task-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--task-accent);
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .tasks-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .task-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-item:hover {
      background: #21262d;
    }

    .task-item.active {
      background: var(--task-accent);
      color: white;
    }

    .task-item-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b949e;
    }

    .task-item-status.idle { background: #8b949e; }
    .task-item-status.proposed { background: var(--task-warning); }
    .task-item-status.running { background: var(--task-info); }
    .task-item-status.completed { background: var(--task-success); }

    /* Task Panel (Main Area) */
    .task-panel {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .task-panel-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
    }

    /* Section 1: Task Input */
    .section-input {
      display: flex;
      gap: 8px;
    }

    .task-input {
      flex: 1;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #e6edf3;
      font-size: 14px;
    }

    .task-input:focus {
      outline: none;
      border-color: var(--task-accent);
    }

    .task-input::placeholder {
      color: #6e7681;
    }

    .send-btn {
      padding: 10px 20px;
      background: var(--task-accent);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .send-btn:hover {
      background: #818cf8;
    }

    /* Section 2: Proposed Actions */
    .section-proposed {
      display: none;
    }

    .section-proposed.visible {
      display: block;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .proposed-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .proposed-item {
      padding: 12px;
      background: #0d1117;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
    }

    .proposed-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .proposed-title {
      font-weight: 500;
      color: #e6edf3;
    }

    .proposed-score {
      font-size: 11px;
      padding: 2px 6px;
      background: var(--task-success);
      color: white;
      border-radius: 4px;
    }

    .proposed-description {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .proposed-subactions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .subaction-tag {
      font-size: 11px;
      padding: 3px 8px;
      background: #21262d;
      border-radius: 4px;
      color: #8b949e;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-approve {
      padding: 8px 16px;
      background: var(--task-success);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-approve:hover {
      background: #16a34a;
    }

    .btn-dismiss {
      padding: 8px 16px;
      background: #21262d;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #e6edf3;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-dismiss:hover {
      background: #30363d;
    }

    /* Section 3: Executing */
    .section-executing {
      display: none;
    }

    .section-executing.visible {
      display: block;
    }

    .executing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .executing-title {
      font-weight: 600;
      color: var(--task-warning);
    }

    .executing-description {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 16px;
    }

    .progress-container {
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 8px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--task-accent), var(--task-info));
      border-radius: 4px;
      animation: progress-pulse 2s ease-in-out infinite;
    }

    @keyframes progress-pulse {
      0%, 100% { width: 0%; }
      50% { width: 70%; }
    }

    .executing-controls {
      display: flex;
      gap: 8px;
    }

    .btn-continue {
      padding: 8px 16px;
      background: var(--task-warning);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-continue:hover {
      background: #ea580c;
    }

    .btn-stop {
      padding: 8px 16px;
      background: #21262d;
      border: 1px solid var(--error);
      border-radius: 6px;
      color: #f85149;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-stop:hover {
      background: #f85149;
      color: white;
    }

    .btn-logs {
      padding: 8px 16px;
      background: #21262d;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      font-size: 13px;
    }

    /* Section 4: History Chain */
    .section-history {
      display: none;
    }

    .section-history.visible {
      display: block;
    }

    .history-chain {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #0d1117;
      border-radius: 6px;
      border-left: 3px solid;
    }

    .history-item.completed {
      border-left-color: var(--task-success);
    }

    .history-item.running {
      border-left-color: var(--task-info);
    }

    .history-step {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #21262d;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 600;
    }

    .history-item.completed .history-step {
      background: var(--task-success);
      color: white;
    }

    .history-item.running .history-step {
      background: var(--task-info);
      color: white;
    }

    .history-content {
      flex: 1;
    }

    .history-title {
      font-size: 13px;
      font-weight: 500;
    }

    .history-result {
      font-size: 11px;
      color: #8b949e;
    }

    /* Section 5: Final Result */
    .section-final {
      display: none;
    }

    .section-final.visible {
      display: block;
    }

    .final-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .final-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .final-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--task-success);
    }

    .final-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .summary-card {
      padding: 12px;
      background: #0d1117;
      border-radius: 6px;
      text-align: center;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--task-accent);
    }

    .summary-label {
      font-size: 11px;
      color: #8b949e;
      margin-top: 4px;
    }

    .btn-new-task {
      padding: 10px 24px;
      background: var(--task-accent);
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    .btn-new-task:hover {
      background: #818cf8;
    }

    /* Debug Panel */
    .debug-panel {
      background: #1a1a2e;
      border-top: 1px solid var(--panel-border);
      padding: 12px;
    }

    .debug-header {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .debug-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .debug-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .debug-btn.task { background: #4a90d9; color: white; }
    .debug-btn.approve { background: #22c55e; color: white; }
    .debug-btn.continue { background: #f97316; color: white; }
    .debug-btn.complete { background: #8b5cf6; color: white; }
    .debug-btn.reset { background: #6b7280; color: white; }

    .debug-btn:hover { filter: brightness(1.1); }
    .debug-btn:active { transform: scale(0.98); }

    .mock-response {
      background: #0d1117;
      padding: 10px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: #a5d6ff;
      max-height: 120px;
      overflow: auto;
      white-space: pre-wrap;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .tasks-sidebar { display: none; }
      .final-summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header: Project & Session Selection -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">🤖 A2A Script Agent</div>
        <div class="header-controls">
          <select class="header-select" id="projectSelect">
            <option value="">Select Project...</option>
            <option value="project-1">My App</option>
            <option value="project-2">E-Commerce</option>
            <option value="project-3">Dashboard</option>
          </select>
          <select class="header-select" id="sessionSelect">
            <option value="">Select Session...</option>
            <option value="session-1">Session #1</option>
            <option value="session-2">Session #2</option>
          </select>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" title="Settings">⚙️</button>
        <button class="icon-btn" title="Help">?</button>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Sidebar: Tasks -->
      <aside class="tasks-sidebar">
        <div class="sidebar-header">
          <span>TASKS</span>
          <button class="add-task-btn" title="New Task">+</button>
        </div>
        <div class="tasks-list" id="tasksList">
          <div class="task-item" data-task-id="task-1">
            <span class="task-item-status idle"></span>
            <span>Task #1</span>
          </div>
          <div class="task-item active" data-task-id="task-2">
            <span class="task-item-status proposed"></span>
            <span>Fix Vue Imports</span>
          </div>
          <div class="task-item" data-task-id="task-3">
            <span class="task-item-status running"></span>
            <span>Task #3</span>
          </div>
        </div>
      </aside>

      <!-- Task Panel -->
      <main class="task-panel">
        <!-- Section 1: Task Input -->
        <div class="task-panel-card section-input" id="sectionInput">
          <input type="text" class="task-input" id="taskInput" placeholder="Що зробити? (або натисніть симуляцію)">
          <button class="send-btn" onclick="simTaskRequest()">→</button>
        </div>

        <!-- Section 2: Proposed Actions -->
        <div class="task-panel-card section-proposed" id="sectionProposed">
          <h3 class="section-title">📋 Proposed Actions</h3>
          <div class="proposed-list" id="proposedList"></div>
          <div class="action-buttons">
            <button class="btn-approve" onclick="simApprove()">▶ Approve</button>
            <button class="btn-dismiss" onclick="resetPanel()">Dismiss</button>
          </div>
        </div>

        <!-- Section 3: Executing -->
        <div class="task-panel-card section-executing" id="sectionExecuting">
          <div class="executing-header">
            <h3 class="executing-title" id="executingTitle">⚡ Executing</h3>
          </div>
          <p class="executing-description" id="executingDescription"></p>
          <div class="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
          <div class="executing-controls">
            <button class="btn-continue" id="continueBtn" onclick="simContinue1()">Continue ▶</button>
            <button class="btn-stop" onclick="resetPanel()">■ Stop</button>
            <button class="btn-logs" onclick="alert('Logs viewer would open here')">📋 Logs</button>
          </div>
        </div>

        <!-- Section 4: History Chain -->
        <div class="task-panel-card section-history" id="sectionHistory">
          <h3 class="section-title">🔗 History Chain</h3>
          <div class="history-chain" id="historyChain"></div>
        </div>

        <!-- Section 5: Final Result -->
        <div class="task-panel-card section-final" id="sectionFinal">
          <div class="final-header">
            <div class="final-icon">🎉</div>
            <h2 class="final-title">TASK COMPLETE</h2>
          </div>
          <div class="final-summary" id="finalSummary"></div>
          <button class="btn-new-task" onclick="resetPanel()">🔄 New Task</button>
        </div>
      </main>
    </div>

    <!-- Debug Panel -->
    <div class="debug-panel">
      <div class="debug-header">🔧 DEBUG CONTROLS / СИМУЛЯЦІЯ</div>
      <div class="debug-buttons">
        <button class="debug-btn task" onclick="simTaskRequest()">1️⃣ Sim Task Request</button>
        <button class="debug-btn approve" onclick="simApprove()">2️⃣ Sim Approve</button>
        <button class="debug-btn continue" onclick="simContinue1()">3️⃣ Sim Continue #1</button>
        <button class="debug-btn continue" onclick="simContinue2()">4️⃣ Sim Continue #2</button>
        <button class="debug-btn complete" onclick="simComplete()">5️⃣ Sim Complete</button>
        <button class="debug-btn reset" onclick="resetPanel()">🔄 Reset Panel</button>
      </div>
      <div class="mock-response" id="mockResponse">// Натисніть кнопку симуляції...</div>
    </div>
  </div>

  <script>
    // ============================================
    // MOCK DATA - 5 Types of Responses
    // ============================================

    const mockTaskRequest = {
      proposedActions: [
        {
          actionId: "fix-vue-imports",
          title: "Виправити зламані імпорти у Vue файлах",
          description: "Автоматично визначити та виправити проблеми з імпортами",
          priority: 10,
          matchScore: 0.95,
          subActions: [
            { actionId: "vue-import-detect", title: "Визначити зламані імпорти", priority: 10 },
            { actionId: "vue-import-resolve", title: "Вирішити правильні шляхи", priority: 9 },
            { actionId: "vue-import-apply", title: "Застосувати виправлення", priority: 8 },
            { actionId: "vue-import-cleanup", title: "Очистити тимчасові файли", priority: 7 }
          ]
        }
      ],
      fallbackActions: [
        { mode: "auto-ai", title: "AI Action Generator" },
        { mode: "manual", title: "Декомпозиція задачі" }
      ]
    };

    const mockApprove = {
      executingAction: {
        actionId: "vue-import-detect",
        title: "Визначити зламані імпорти",
        description: "Сканує Vue файли і знаходить біті імпорти",
        priority: 10,
        dsl: {
          script: "vue-import-detect",
          input: { rootDir: ".", filePattern: "**/*.vue" },
          output: "broken_imports[]"
        }
      },
      nextSteps: [
        { actionId: "vue-import-resolve", title: "Вирішити правильні шляхи" },
        { actionId: "vue-import-apply", title: "Застосувати виправлення" },
        { actionId: "vue-import-cleanup", title: "Очистити" }
      ]
    };

    const mockContinue1 = {
      context: {
        execution: {
          actionId: "fix-vue-imports",
          currentActionId: "vue-import-resolve",
          history: [
            { step: 1, actionId: "vue-import-detect", status: "completed", result: { broken_imports: 3 } }
          ]
        }
      },
      previousStep: {
        actionId: "vue-import-detect",
        result: { broken_imports: 3 }
      },
      executingAction: {
        actionId: "vue-import-resolve",
        title: "Вирішити правильні шляхи",
        description: "На основі списку бітих імпортів знаходить правильні шляхи",
        dsl: {
          script: "vue-import-resolve",
          input: { broken_imports: ["@/components/Header", "@/services/api"], aliases: { "@": "resources/js" } },
          output: "patches[]"
        }
      },
      nextSteps: [
        { actionId: "vue-import-apply", title: "Застосувати виправлення" },
        { actionId: "vue-import-cleanup", title: "Очистити" }
      ]
    };

    const mockContinue2 = {
      context: {
        execution: {
          actionId: "fix-vue-imports",
          currentActionId: "vue-import-apply",
          history: [
            { step: 1, actionId: "vue-import-detect", status: "completed", result: { broken_imports: 3 } },
            { step: 2, actionId: "vue-import-resolve", status: "completed", result: { patches: 3 } }
          ]
        }
      },
      previousStep: {
        actionId: "vue-import-resolve",
        result: { patches: 3 }
      },
      executingAction: {
        actionId: "vue-import-apply",
        title: "Застосувати виправлення",
        description: "Застосовує виправлені шляхи до файлів",
        dsl: {
          script: "vue-import-apply",
          input: { patches: [{ file: "App.vue", from: "@/components/Header", to: "./components/Header" }] },
          output: "fixed_files[]"
        }
      },
      nextSteps: [
        { actionId: "vue-import-cleanup", title: "Очистити" }
      ]
    };

    const mockComplete = {
      context: {
        execution: {
          actionId: "fix-vue-imports",
          currentActionId: "vue-import-cleanup",
          status: "completed",
          history: [
            { step: 1, actionId: "vue-import-detect", status: "completed", result: { broken_imports: 3 } },
            { step: 2, actionId: "vue-import-resolve", status: "completed", result: { patches: 3 } },
            { step: 3, actionId: "vue-import-apply", status: "completed", result: { fixed_files: 3 } },
            { step: 4, actionId: "vue-import-cleanup", status: "completed", result: { cleanup_count: 0 } }
          ]
        }
      },
      previousStep: {
        actionId: "vue-import-apply",
        result: { fixed_files: 3 }
      },
      finalResult: {
        actionId: "fix-vue-imports",
        summary: {
          broken_imports_found: 3,
          patches_resolved: 3,
          files_fixed: 3,
          cleanup_count: 0
        }
      }
    };

    // ============================================
    // STATE MANAGEMENT
    // ============================================

    let panelState = {
      status: 'idle',  // idle | proposed | running | completed
      proposedActions: null,
      executingAction: null,
      history: [],
      previousStep: null,
      finalResult: null,
      continueStep: 0
    };

    // ============================================
    // RENDER FUNCTIONS
    // ============================================

    function renderProposedActions(actions) {
      const container = document.getElementById('proposedList');
      container.innerHTML = '';

      actions.forEach(action => {
        const item = document.createElement('div');
        item.className = 'proposed-item';
        item.innerHTML = `
          <div class="proposed-item-header">
            <span class="proposed-title">${action.title}</span>
            <span class="proposed-score">${Math.round(action.matchScore * 100)}%</span>
          </div>
          <p class="proposed-description">${action.description}</p>
          <div class="proposed-subactions">
            ${action.subActions.map(sa => `<span class="subaction-tag">${sa.title}</span>`).join('')}
          </div>
        `;
        container.appendChild(item);
      });

      document.getElementById('sectionProposed').classList.add('visible');
    }

    function renderExecuting(action, isUpdate = false) {
      document.getElementById('executingTitle').textContent = `⚡ ${action.title}`;
      document.getElementById('executingDescription').textContent = action.description || '';
      
      // Reset and animate progress
      const progress = document.getElementById('progressFill');
      progress.style.animation = 'none';
      progress.offsetHeight; // Trigger reflow
      progress.style.animation = 'progress-pulse 2s ease-in-out infinite';
      
      document.getElementById('sectionExecuting').classList.add('visible');
    }

    function renderHistory(history) {
      const container = document.getElementById('historyChain');
      container.innerHTML = '';

      history.forEach((item, index) => {
        const historyItem = document.createElement('div');
        const isRunning = index === history.length - 1;
        historyItem.className = `history-item ${item.status}`;
        historyItem.innerHTML = `
          <span class="history-step">${item.step}</span>
          <div class="history-content">
            <div class="history-title">${item.actionId}</div>
            <div class="history-result">${JSON.stringify(item.result)}</div>
          </div>
        `;
        container.appendChild(historyItem);
      });

      if (history.length > 0) {
        document.getElementById('sectionHistory').classList.add('visible');
      }
    }

    function renderPreviousResult(result) {
      // Previous result is shown in history, so this is handled by renderHistory
    }

    function renderNextSteps(nextSteps) {
      // Update continue button based on current state
      const continueBtn = document.getElementById('continueBtn');
      if (nextSteps && nextSteps.length > 0) {
        continueBtn.style.display = 'block';
      }
    }

    function renderFinalResult(result) {
      const container = document.getElementById('finalSummary');
      container.innerHTML = '';

      const summary = result.summary;
      const items = [
        { value: summary.broken_imports_found, label: 'Found' },
        { value: summary.patches_resolved, label: 'Resolved' },
        { value: summary.files_fixed, label: 'Fixed' },
        { value: summary.cleanup_count, label: 'Cleaned' }
      ];

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'summary-card';
        card.innerHTML = `
          <div class="summary-value">${item.value}</div>
          <div class="summary-label">${item.label}</div>
        `;
        container.appendChild(card);
      });

      document.getElementById('sectionFinal').classList.add('visible');
    }

    function clearAllSections() {
      document.getElementById('sectionProposed').classList.remove('visible');
      document.getElementById('sectionExecuting').classList.remove('visible');
      document.getElementById('sectionHistory').classList.remove('visible');
      document.getElementById('sectionFinal').classList.remove('visible');
      document.getElementById('taskInput').value = '';
    }

    function hideProposedActions() {
      document.getElementById('sectionProposed').classList.remove('visible');
    }

    // ============================================
    // SIMULATION FUNCTIONS
    // ============================================

    function simTaskRequest() {
      const response = mockTaskRequest;
      panelState.status = 'proposed';
      panelState.proposedActions = response.proposedActions;
      panelState.fallbackActions = response.fallbackActions;
      panelState.continueStep = 0;

      // Clear other sections first
      clearAllSections();
      
      // Render proposed actions
      renderProposedActions(response.proposedActions);
      
      // Show in mock viewer
      document.getElementById('mockResponse').textContent = JSON.stringify(response, null, 2);
      
      // Update task status
      updateTaskStatus('task-2', 'proposed');
    }

    function simApprove() {
      if (panelState.status !== 'proposed') {
        alert('Спочатку натисніть "Sim Task Request"');
        return;
      }

      const response = mockApprove;
      panelState.status = 'running';
      panelState.executingAction = response.executingAction;
      panelState.history = [];
      panelState.continueStep = 1;

      // Render executing section
      renderExecuting(response.executingAction);
      renderNextSteps(response.nextSteps);

      // Hide proposed actions
      hideProposedActions();

      // Show history (empty initially)
      document.getElementById('sectionHistory').classList.add('visible');
      document.getElementById('historyChain').innerHTML = '<div style="color: #8b949e; font-size: 12px;">History will appear after continue...</div>';

      // Update mock viewer
      document.getElementById('mockResponse').textContent = JSON.stringify(response, null, 2);
      
      // Update task status
      updateTaskStatus('task-2', 'running');
    }

    function simContinue1() {
      if (panelState.status !== 'running') {
        alert('Спочатку натисніть "Sim Approve"');
        return;
      }

      const response = mockContinue1;
      panelState.executingAction = response.executingAction;
      panelState.history = response.context.execution.history;
      panelState.previousStep = response.previousStep;
      panelState.continueStep = 2;

      // Update UI
      renderHistory(panelState.history);
      renderExecuting(response.executingAction);
      renderNextSteps(response.nextSteps);

      // Update mock viewer
      document.getElementById('mockResponse').textContent = JSON.stringify(response, null, 2);
    }

    function simContinue2() {
      if (panelState.status !== 'running' || panelState.continueStep < 2) {
        alert('Спочатку натисніть "Sim Continue #1"');
        return;
      }

      const response = mockContinue2;
      panelState.executingAction = response.executingAction;
      panelState.history = response.context.execution.history;
      panelState.previousStep = response.previousStep;
      panelState.continueStep = 3;

      // Update UI
      renderHistory(panelState.history);
      renderExecuting(response.executingAction);
      renderNextSteps(response.nextSteps);

      // Update mock viewer
      document.getElementById('mockResponse').textContent = JSON.stringify(response, null, 2);
    }

    function simComplete() {
      if (panelState.status !== 'running' || panelState.continueStep < 3) {
        alert('Спочатку натисніть "Sim Continue #2"');
        return;
      }

      const response = mockComplete;
      panelState.status = 'completed';
      panelState.finalResult = response.finalResult;
      panelState.history = response.context.execution.history;
      panelState.previousStep = response.previousStep;
      panelState.executingAction = null;

      // Hide executing section
      document.getElementById('sectionExecuting').classList.remove('visible');

      // Render final result
      renderFinalResult(response.finalResult);
      renderHistory(panelState.history);

      // Update mock viewer
      document.getElementById('mockResponse').textContent = JSON.stringify(response, null, 2);
      
      // Update task status
      updateTaskStatus('task-2', 'completed');
    }

    function resetPanel() {
      panelState = {
        status: 'idle',
        proposedActions: null,
        executingAction: null,
        history: [],
        previousStep: null,
        finalResult: null,
        continueStep: 0
      };

      // Clear all sections
      clearAllSections();

      // Reset mock viewer
      document.getElementById('mockResponse').textContent = '// Панель скинута';
      
      // Reset task status
      updateTaskStatus('task-2', 'idle');
    }

    function updateTaskStatus(taskId, status) {
      const taskItem = document.querySelector(`[data-task-id="${taskId}"]`);
      if (taskItem) {
        const statusDot = taskItem.querySelector('.task-item-status');
        statusDot.className = `task-item-status ${status}`;
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Add click handlers to task items
      document.querySelectorAll('.task-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.task-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
        });
      });

      // Enter key for task input
      document.getElementById('taskInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          simTaskRequest();
        }
      });
    });
  </script>
</body>
</html>
