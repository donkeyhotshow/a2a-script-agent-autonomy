<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2A Client - VueFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/json-ui.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">A2A</div>
      <nav class="nav">
        <a href="#" class="nav-link active" data-page="sessions">Sessions</a>
      </nav>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">—</span>
      </div>
    </header>

    <main class="main">
      <!-- VueFlow Graph Container (always visible on right) -->
      <div id="flow-container" class="flow-container">
        <div class="flow-header">
          <h3>🔀 Protocol Flow</h3>
          <div class="flow-controls">
            <button class="btn btn-small" id="flowZoomIn">+</button>
            <button class="btn btn-small" id="flowZoomOut">−</button>
            <button class="btn btn-small" id="flowFitView">Fit</button>
          </div>
        </div>
        <div id="vueflow-graph" class="vueflow-graph"></div>
      </div>

      <!-- Sessions -->
      <section class="page active" id="page-sessions">
        <div class="sessions-layout">
          <aside class="sessions-sidebar">
            <div class="page-header">
              <h2>Sessions</h2>
              <button class="btn btn-primary" id="newSession">+ New</button>
            </div>
            <select id="sessionFilter">
              <option value="all">All</option>
              <option value="active">Active</option>
              <option value="waiting">Waiting</option>
              <option value="completed">Done</option>
            </select>
            <div class="sessions-list" id="sessionsList"></div>
          </aside>
          <div class="session-panel">
            <div class="session-header" id="sessionHeader">
              <span class="session-id"></span>
            </div>
            <div class="session-messages" id="sessionMessages"></div>
            <div id="graphPanel"></div>
            
            <!-- Action Progress -->
            <div id="action-progress" class="action-progress" style="display: none;">
              <div class="action-header">
                <span id="action-title">Action</span>
                <span id="action-progress-text"></span>
              </div>
              <div class="progress-bar">
                <div id="action-progress-bar" class="progress-fill" style="width: 0%"></div>
              </div>
              <div id="action-steps" class="action-steps"></div>
              <div id="action-log" class="action-log"></div>
              <div class="action-actions">
                <button class="btn btn-primary" id="action-run" style="display: none;">Run</button>
                <button class="btn btn-secondary" id="action-cancel" style="display: none;">Cancel</button>
              </div>
            </div>
            
            <div class="session-input-bar">
              <textarea id="messageInput" placeholder="Enter task..."></textarea>
              <div class="input-actions">
                <button class="btn btn-secondary" id="btnContinue">Делаем</button>
                <button class="btn btn-primary" id="sendMessage">Send</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="currentProject">No project</span>
    </footer>
  </div>

  <!-- Add Project Modal -->
  <div class="modal" id="addProjectModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Add Project</h3>
        <button class="btn btn-icon modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Name</label>
          <input type="text" id="projectName" placeholder="My Project">
        </div>
        <div class="field">
          <label>Path</label>
          <input type="text" id="projectPath" placeholder="C:\path\to\project">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="saveProject">Add</button>
      </div>
    </div>
  </div>

  <!-- VueFlow Scripts -->
  <script src="js/flow/nodes.js" type="module"></script>
  <script src="js/flow/protocol.js" type="module"></script>
  <script src="js/flow/index.js" type="module"></script>
  
  <!-- JSON UI Components -->
  <script src="js/json/adapter.js" type="module"></script>
  <script src="js/json/ui.js" type="module"></script>
  
  <!-- Sessions with VueFlow Integration -->
  <script src="js/sessions.js"></script>
</body>
</html>
