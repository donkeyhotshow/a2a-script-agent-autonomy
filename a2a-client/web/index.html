<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2A Script Agent - Task</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/progress-indicators.css">
    <link rel="stylesheet" href="css/components/message-input.css">
</head>
<body>
<div id="app" class="app-container">
    <div id="header-container"></div>
    <main class="app-main" role="main">
        <p class="app-main-hint">Enter a task above and click Send. Result appears in the panel.</p>

        <!-- Message Input for Dialog -->
        <div class="message-input-section" id="messageInputSection" style="display: none;">
            <div class="message-input-container">
                <input type="text" id="messageInput" class="message-input-field" placeholder="Type your message…" autocomplete="off">
                <button type="button" id="sendMessage" class="message-send-btn">Send</button>
            </div>
        </div>
    </main>

</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Settings</h2>
            <button class="modal-close" id="closeSettingsModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Client API URL</label>
                <input type="text" id="settingsApiUrl" value="/api" placeholder="/api or http://localhost:3001/api" class="form-input">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
            <button class="btn btn-primary" id="saveSettings">Save</button>
        </div>
    </div>
</div>

<!-- Projects Modal -->
<div id="projectsModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2>Projects</h2>
            <button class="modal-close" id="closeProjectsModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="projects-toolbar">
                <button class="btn btn-primary" id="newProjectBtn">+ New Project</button>
            </div>
            <div class="projects-grid" id="projectsGrid">
                <div class="loading-indicator">Loading...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelProjects">Close</button>
        </div>
    </div>
</div>

<!-- Notifications -->
<div id="notificationsPanel" class="notifications-panel" style="display: none;">
    <div class="notifications-header">
        <span>Notifications</span>
        <button id="clearNotifications">&times;</button>
    </div>
    <div class="notifications-list" id="notificationsList"></div>
</div>

<!-- ===== New Unified Architecture ===== -->

<!-- 0. Storage API -->
<script src="js/storage.js"></script>

<!-- 1. Core State (Single Source of Truth) -->
<script src="js/session-store.js"></script>

<!-- 2. Transport (SSE Primary + WebSocket Fallback) -->
<script src="js/transport-manager.js"></script>
<script src="js/session-sync-v2.js"></script>

<!-- 3. Adapters (Backward Compatibility Layer) -->
<script src="js/session-store-adapters.js"></script>

<!-- 4. Simplified Panel System -->
<script src="js/panel-manager.js"></script>
<link rel="stylesheet" href="css/components/panel-manager.css">

<!-- 5. Unified Action Handler -->
<script src="js/action-handler.js"></script>

<!-- 6. CLI Command Handler -->
<script src="js/command-handler.js"></script>

<!-- ===== Application Modules ===== -->
<script src="js/template-loader.js"></script>
<script src="js/api-integration.js"></script>
<script src="js/progress-indicators.js"></script>
<script src="js/error-handler.js"></script>
<script src="js/web-api-client.js"></script>
<script src="js/task-flow.js"></script>
<script src="js/app-task.js"></script>

<script>
    // Initialize new architecture on page load
    document.addEventListener('DOMContentLoaded', async () => {
        // Force adapter installation (replaces legacy globals)
        window.FORCE_SESSION_STORE = true;

        // Initialize core systems
        SessionStore.init();
        TransportManager.init();
        await PanelManager.init().syncWithSessionStore();

        // Restore previous session if available
        try {
            const hasSaved = await SessionStore.hasSavedSession();
            if (hasSaved) {
                const restored = await SessionStore.restoreAndReconnect();
                if (restored) {
                    console.log('[A2A] Session restored from storage');

                    // Re-open task panel if there was an active session
                    const state = SessionStore.getState();
                    if (state.sessionId && state.execute && window.TaskFlow) {
                        window.TaskFlow.restorePanel(state);
                    }
                }
            }
        } catch (error) {
            console.warn('[A2A] Failed to check/restore session:', error);
        }

        console.log('[A2A] Unified architecture initialized');
    });
</script>
</body>
</html>
