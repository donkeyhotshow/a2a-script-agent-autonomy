<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2A Script Agent - Task</title>
    <link rel="stylesheet" href="css/app.css">
        <link rel="stylesheet" href="css/progress-indicators.css">
</head>
<body>
<div id="app" class="app-container">
    <div id="header-container"></div>
    <main class="app-main" role="main">
        <p class="app-main-hint">Enter a task above and click Send. Result appears in the panel.</p>
    </main>

</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Settings</h2>
            <button class="modal-close" id="closeSettingsModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Client API URL</label>
                <input type="text" id="settingsApiUrl" value="/api" placeholder="/api or http://localhost:3001/api" class="form-input">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
            <button class="btn btn-primary" id="saveSettings">Save</button>
        </div>
    </div>
</div>

<!-- Projects Modal -->
<div id="projectsModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2>Projects</h2>
            <button class="modal-close" id="closeProjectsModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="projects-toolbar">
                <button class="btn btn-primary" id="newProjectBtn">+ New Project</button>
            </div>
            <div class="projects-grid" id="projectsGrid">
                <div class="loading-indicator">Loading...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelProjects">Close</button>
        </div>
    </div>
</div>

<!-- Notifications -->
<div id="notificationsPanel" class="notifications-panel" style="display: none;">
    <div class="notifications-header">
        <span>Notifications</span>
        <button id="clearNotifications">&times;</button>
    </div>
    <div class="notifications-list" id="notificationsList"></div>
</div>

<script src="js/template-loader.js"></script>
<script src="js/api-integration.js"></script>
<script src="js/session-manager.js"></script>
<script src="js/websocket-client.js"></script>
<script src="js/session-view-model.js"></script>
<script src="js/sse-client.js"></script>
<script src="js/session-sync.js"></script>
<script src="js/progress-indicators.js"></script>
<script src="js/error-handler.js"></script>
<script src="js/web-api-client.js"></script>
<script src="js/plasticine-ui.js"></script>
<script src="js/plasticine-workflow.js"></script>
<script src="js/task-flow.js"></script>
<script src="js/session-panel-manager.js"></script>
<script src="js/app-task.js"></script>
</body>
</html>
