<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2A Script Agent - Flow Graph</title>
  
  <!-- Import maps for VueFlow and Vue -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
      "@vue-flow/core": "https://unpkg.com/@vue-flow/core@1.33.5/dist/vue-flow.esm-browser.js",
      "@vue-flow/background": "https://unpkg.com/@vue-flow/background@1.33.5/dist/vue-flow-background.esm-browser.js",
      "@vue-flow/controls": "https://unpkg.com/@vue-flow/controls@1.33.5/dist/vue-flow-controls.esm-browser.js",
      "@vue-flow/minimap": "https://unpkg.com/@vue-flow/minimap@1.33.5/dist/vue-flow-minimap.esm-browser.js"
    }
  }
  </script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/typography.css">
  <link rel="stylesheet" href="css/layouts/main.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/floating-panel.css">
  <link rel="stylesheet" href="css/components/panel-cube.css">
  <link rel="stylesheet" href="css/components/panel-dock.css">
  <link rel="stylesheet" href="css/components/graph-panel.css">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- VueFlow styles -->
  <link rel="stylesheet" href="https://unpkg.com/@vue-flow/core@1.33.5/dist/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@vue-flow/controls@1.33.5/dist/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@vue-flow/minimap@1.33.5/dist/style.css">
</head>
<body>
  <!-- App Container -->
  <div id="app" class="app-container">
    
    <!-- Header Container (loads from template) -->
    <div id="header-container"></div>

    <!-- Main Content Area -->
    <main class="app-main" role="main">
      
      <!-- Graph Panel Container (loads from template) -->
      <div id="graph-panel-container"></div>

      <!-- Floating Panels Container -->
      <div id="panels-container" class="panels-container"></div>
      
    </main>

    <!-- Footer Container (loads from template) -->
    <div id="footer-container"></div>

  </div>

  <!-- Task Input Modal (hidden by default) -->
  <div id="taskModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>New Task</h2>
        <button class="modal-close" id="closeTaskModal">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="taskInput" placeholder="Describe your task..." rows="4"></textarea>
        <div class="modal-options">
          <label>
            <input type="checkbox" id="useSSE" checked> Use SSE for real-time updates
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelTask">Cancel</button>
        <button class="btn btn-primary" id="submitTask">Submit Task</button>
      </div>
    </div>
  </div>

  <!-- Template Loader -->
  <script src="js/template-loader.js"></script>
  
  <!-- JavaScript Modules -->
  <script type="module">
    // Import and initialize flow
    import { initFlowPanel, loadDemo, connectToSession, disconnectFromSession } from './js/flow/init.js';
    import { flowManager } from './js/flow/index.js';
    import SSEClient from './js/sse-client.js';
    import { normalizeDocKey, openDocPanel, getDocKeys } from './js/doc-panels.js';

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('[App] Initializing...');
      
      // Load templates first
      const templatesLoaded = await TemplateLoader.init();
      
      if (!templatesLoaded) {
        console.warn('[App] Templates failed to load, using fallback');
      }
      
      // Initialize flow panel
      initFlowPanel({
        serverUrl: 'http://localhost:8080/api/v1',
        useSSE: true
      });

      // Setup SSE status indicator
      setupSSEStatus();

      // Setup toolbar handlers
      setupToolbar();

      // Setup modal handlers
      setupModal();

      // Doc open: one input → open doc panel (no duplicate)
      setupDocOpen();

      // Check URL for session
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session');
      if (sessionId) {
        connectToSession(sessionId);
      }

      console.log('[App] Initialized');
    });

    // Setup SSE status indicator
    function setupSSEStatus() {
      const statusEl = document.getElementById('sseStatus');
      if (!statusEl) return;
      
      const statusText = statusEl.querySelector('.status-text');

      SSEClient.on('connected', () => {
        statusEl.className = 'sse-status connected';
        statusText.textContent = 'Connected';
      });

      SSEClient.on('disconnected', () => {
        statusEl.className = 'sse-status disconnected';
        statusText.textContent = 'Disconnected';
      });

      SSEClient.on('error', () => {
        statusEl.className = 'sse-status disconnected';
        statusText.textContent = 'Error';
      });
    }

    // Setup toolbar handlers
    function setupToolbar() {
      // Zoom controls
      document.getElementById('flowZoomIn')?.addEventListener('click', () => flowManager.zoomIn());
      document.getElementById('flowZoomOut')?.addEventListener('click', () => flowManager.zoomOut());
      document.getElementById('flowFitView')?.addEventListener('click', () => flowManager.fitView());
      document.getElementById('flowClear')?.addEventListener('click', () => flowManager.clear());

      // Demo buttons
      document.getElementById('flowLoadSimple')?.addEventListener('click', () => loadDemo('simple'));
      document.getElementById('flowLoadWorkflow')?.addEventListener('click', () => loadDemo('workflow'));
      document.getElementById('flowLoadAgents')?.addEventListener('click', () => loadDemo('agents'));

      // Panel controls
      document.getElementById('panelZoomIn')?.addEventListener('click', () => flowManager.zoomIn());
      document.getElementById('panelZoomOut')?.addEventListener('click', () => flowManager.zoomOut());
      document.getElementById('panelFitView')?.addEventListener('click', () => flowManager.fitView());
      document.getElementById('panelClear')?.addEventListener('click', () => flowManager.clear());

      // Demo button in header
      document.getElementById('loadDemoBtn')?.addEventListener('click', () => {
        loadDemo('workflow');
      });

      // Connect button
      document.getElementById('connectBtn')?.addEventListener('click', () => {
        const sessionId = prompt('Enter session ID to connect:');
        if (sessionId) {
          connectToSession(sessionId);
        }
      });

      // New task button
      document.getElementById('newTaskBtn')?.addEventListener('click', () => {
        document.getElementById('taskModal').style.display = 'flex';
      });
    }

    // Doc open form: submit opens doc in new panel; if already open, focus it
    function setupDocOpen() {
      const form = document.getElementById('docOpenForm');
      const input = document.getElementById('docOpenInput');
      const list = document.getElementById('docList');
      const container = document.getElementById('panels-container');
      if (!form || !input || !container) return;
      getDocKeys().forEach((k) => {
        const opt = document.createElement('option');
        opt.value = k;
        list?.appendChild(opt);
      });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const key = normalizeDocKey(input.value);
        if (key) {
          openDocPanel(key, container);
          input.value = '';
        } else if (input.value.trim()) {
          console.warn('[Doc] Unknown doc:', input.value.trim());
        }
      });
    }

    // Setup modal handlers
    function setupModal() {
      const modal = document.getElementById('taskModal');
      
      document.getElementById('closeTaskModal')?.addEventListener('click', () => {
        modal.style.display = 'none';
      });

      document.getElementById('cancelTask')?.addEventListener('click', () => {
        modal.style.display = 'none';
      });

      document.getElementById('submitTask')?.addEventListener('click', async () => {
        const taskText = document.getElementById('taskInput').value;
        const useSSE = document.getElementById('useSSE').checked;

        if (!taskText.trim()) {
          alert('Please enter a task');
          return;
        }

        try {
          await flowManager.sendTask(taskText, { useSSE });
          modal.style.display = 'none';
          document.getElementById('taskInput').value = '';
        } catch (error) {
          console.error('Failed to send task:', error);
          alert('Failed to send task: ' + error.message);
        }
      });

      // Close modal on outside click
      modal?.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.style.display = 'none';
        }
      });
    }

    // Update flow stats
    flowManager.onComplete(() => {
      const stats = document.getElementById('flowStats');
      if (!stats) return;
      const nodes = flowManager.currentFlow.nodes.length;
      const edges = flowManager.currentFlow.edges.length;
      stats.textContent = `Nodes: ${nodes} | Edges: ${edges}`;
    });
  </script>
</body>
</html>
