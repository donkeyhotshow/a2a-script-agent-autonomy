<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var CLIENT_API_KEY = 'a2a_clientApiUrl';
            try {
                var stored = localStorage.getItem(CLIENT_API_KEY);
                if (stored === '[object Object]' || (typeof stored === 'string' && stored.indexOf('[object') !== -1)) {
                    console.warn('[A2A] Corrupted API URL in localStorage, reset to /api');
                    localStorage.setItem(CLIENT_API_KEY, '/api');
                }
            } catch (e) {
                console.warn('[A2A] localStorage unavailable (private mode or blocked):', e);
            }
        })();
    </script>
    <title>A2A Script Agent - Task</title>
    <base id="app-base" href="/">
    <script>
        (function () {
            var path = location.pathname.replace(/\/index\.html$/i, '').replace(/\/$/, '') || '';
            if (path) document.getElementById('app-base').href = path + '/';
        })();
    </script>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/components/floating-panel.css">
    <link rel="stylesheet" href="css/components/notifications.css">
    <link rel="stylesheet" href="css/components/projects.css">
    <link rel="stylesheet" href="css/components/error-handler.css">
    <link rel="stylesheet" href="css/components/terminal.css">
    <link rel="stylesheet" href="css/components/storage.css">
    <link rel="stylesheet" href="css/components/taskbar.css">
    <link rel="stylesheet" href="css/components/session-window.css">
    <link rel="stylesheet" href="css/components/task-flow.css">
    <link rel="stylesheet" href="css/components/modal-utils.css">
</head>
<body>
<div id="app" class="app-container">
    <div id="header-container"></div>
    <main class="app-main" role="main">
        <p class="app-main-hint">Enter a task above and click Send. Result appears in the panel.</p>

    </main>

</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Settings</h2>
            <button type="button" class="modal-close" id="closeSettingsModal" aria-label="Close settings">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="settingsApiUrl">Client API URL</label>
                <input type="text" id="settingsApiUrl" value="/api" placeholder="/api or http://localhost:3001/api" class="form-input" autocomplete="off" />
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="cancelSettings">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveSettings">Save</button>
        </div>
    </div>
</div>

<!-- Projects Modal -->
<div id="projectsModal" class="modal" style="display: none;">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2>Projects</h2>
            <button type="button" class="modal-close" id="closeProjectsModal" aria-label="Close projects">&times;</button>
        </div>
        <div class="modal-body">
            <div class="projects-toolbar">
                <button type="button" class="btn btn-primary" id="newProjectBtn">+ New Project</button>
            </div>
            <div class="projects-grid" id="projectsGrid">
                <div class="loading-indicator">Loading...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="cancelProjects">Close</button>
        </div>
    </div>
</div>

<!-- Notifications -->
<div id="notificationsPanel" class="notifications-panel" style="display: none;">
    <div class="notifications-header">
        <span>Notifications</span>
        <button type="button" id="clearNotifications" aria-label="Clear notifications">&times;</button>
    </div>
    <div class="notifications-list" id="notificationsList"></div>
</div>

<!-- ===== New Unified Architecture ===== -->

<!-- 0. Storage API -->
<script src="js/storage.js"></script>

<!-- 0.5 Web daemons (before session-store) -->
<script src="js/daemons/emitter.js"></script>
<script src="js/daemons/dialog-loader.js"></script>
<script src="js/daemons/dialog-promise-poll.js"></script>

<!-- SessionStore stack: classic deps first; module installs Normalizers; defer runs after so new SessionStore() sees Normalizers -->
<script src="js/html-utils.js"></script>
<script src="js/session-data.js"></script>
<!-- After storage.js: replaces global.SessionStorageAPI with { create } factory for SessionStore -->
<script src="js/session-storage.js"></script>
<script type="module" src="js/install-normalizers.mjs"></script>
<script defer src="js/session-store.js"></script>
<script defer src="js/task-flow/utils.js"></script>

<!-- 4. Simplified Panel System -->


<!-- 6. CLI Command Handler -->

<!-- ===== Application Modules ===== -->
<script defer src="js/template-loader.js"></script>
<script defer src="js/api-integration.js"></script>
<script defer src="js/action-parser.js"></script>
<script defer src="js/action-validator.js"></script>
<script defer src="js/action-executor.js"></script>
<script defer src="js/error-handler.js?v=3"></script>
<!-- Modular TaskFlow -->
<script defer src="js/task-flow/render.js"></script>
<script defer src="js/task-flow/loader.js"></script>
<script defer src="js/task-flow/tasks.js"></script>
<script defer src="js/task-flow/messages.js"></script>
<script defer src="js/task-flow/init.js"></script>
<script defer src="js/task-flow/index.js"></script>
<script defer src="js/resolve-web-script-url.js"></script>
<script defer src="js/app-task.js"></script>

<script>
    // Initialize new architecture on page load
    document.addEventListener('DOMContentLoaded', async () => {
        // Force adapter installation (replaces legacy globals)
        window.FORCE_SESSION_STORE = true;

        // Wait for dynamically loaded modules to be available
        await waitForModules();

        // Initialize core systems
        if (window.SessionStore) SessionStore.init();
        if (window.PanelManager) await PanelManager.init().syncWithSessionStore();

        // Restore previous session if available
        try {
            const hasSaved = await SessionStore.hasSavedSession();
            if (hasSaved) {
                const restored = await SessionStore.restoreAndReconnect();
                if (restored) {
                    console.log('[A2A] Session restored from storage');
                }
            }
        } catch (error) {
            console.warn('[A2A] Failed to check/restore session:', error);
        }

        console.log('[A2A] Unified architecture initialized');
    });

    // Wait for sync stack + dynamic app scripts (js/app-task.js chain) to avoid init before WindowState
    function waitForModules() {
        return new Promise((resolve) => {
            const started = Date.now();
            const maxMs = 20000;
            const check = () => {
                const hasSessionStore = typeof window.SessionStore !== 'undefined';
                const hasTaskFlow = typeof window.TaskFlow !== 'undefined';
                const hasPanelManager = typeof window.PanelManager !== 'undefined';
                const hasPanel = typeof window.Panel !== 'undefined';
                const appScriptsDone = window._appModulesLoaded === true;
                const hasWindowState =
                    typeof window.WindowState !== 'undefined' &&
                    typeof window.WindowState.toggleSessionWindow === 'function';
                const timedOut = Date.now() - started > maxMs;

                const modulesReady =
                    hasSessionStore &&
                    hasTaskFlow &&
                    (timedOut || (appScriptsDone && hasWindowState));

                if (modulesReady) {
                    if (timedOut && !appScriptsDone) {
                        console.warn('[A2A] Dynamic app modules not ready after ' + maxMs + 'ms; continuing');
                    } else if (timedOut && appScriptsDone && !hasWindowState) {
                        console.warn('[A2A] WindowState missing after ' + maxMs + 'ms; continuing');
                    }
                    if (hasPanelManager && hasPanel) {
                        window._panelModulesLoaded = true;
                    }
                    resolve();
                } else {
                    setTimeout(check, 50);
                }
            };
            check();
        });
    }
</script>
</body>
</html>
