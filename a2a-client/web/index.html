<div id="settingsModal" class="modal" style="display: none;">

<script>
    // Fix corrupted localStorage values before anything else loads
    (function() {
        const CLIENT_API_KEY = 'a2a_clientApiUrl';
        const stored = localStorage.getItem(CLIENT_API_KEY);
        if (stored === '[object Object]' || (typeof stored === 'string' && stored.includes('[object'))) {
            console.warn('[A2A] Found corrupted API URL in localStorage, resetting to default');
            localStorage.setItem(CLIENT_API_KEY, '/api');
        }
    })();

    // Initialize new architecture on page load
    document.addEventListener('DOMContentLoaded', async () => {
        // Force adapter installation (replaces legacy globals)
        window.FORCE_SESSION_STORE = true;

        // Wait for dynamically loaded modules to be available
        await waitForModules();

        // Initialize core systems
        if (window.SessionStore) SessionStore.init();
        if (window.PanelManager) await PanelManager.init().syncWithSessionStore();

        // Restore previous session if available
        try {
            const hasSaved = await SessionStore.hasSavedSession();
            if (hasSaved) {
                const restored = await SessionStore.restoreAndReconnect();
                if (restored) {
                    console.log('[A2A] Session restored from storage');
                }
            }
        } catch (error) {
            console.warn('[A2A] Failed to check/restore session:', error);
        }

        console.log('[A2A] Unified architecture initialized');
    });

    // Wait for dynamically loaded modules
    function waitForModules() {
        return new Promise((resolve) => {
            const check = () => {
                const panelReady = window._panelModulesLoaded && typeof window.Panel !== 'undefined' && typeof window.PanelManager !== 'undefined';

                if (panelReady) {
                    resolve();
                } else {
                    setTimeout(check, 50);
                }
            };
            check();
        });
    }
</script>
