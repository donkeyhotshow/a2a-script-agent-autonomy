<body>
<div id="app" class="app-container">

<!-- Settings Modal -->
<div id="settingsModal" class="modal" style="display: none;">

        <div class="modal-header">

            <button class="modal-close" id="closeSettingsModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Client API URL</label>
                <input type="text" id="settingsApiUrl" value="/api" placeholder="/api or http://localhost:3001/api" class="form-input" />

        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelSettings">Cancel</button>

        </div>
    </div>
</div>

<!-- Projects Modal -->

            <div class="projects-toolbar">
                <button class="btn btn-primary" id="newProjectBtn">+ New Project</button>
            </div>
            <div class="projects-grid" id="projectsGrid">
                <div class="loading-indicator">Loading...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelProjects">Close</button>
        </div>
    </div>
</div>

<!-- Notifications -->
<div id="notificationsPanel" class="notifications-panel" style="display: none;">

<script>
    // Fix corrupted localStorage values before anything else loads
    (function() {
        const CLIENT_API_KEY = 'a2a_clientApiUrl';
        const stored = localStorage.getItem(CLIENT_API_KEY);
        if (stored === '[object Object]' || (typeof stored === 'string' && stored.includes('[object'))) {
            console.warn('[A2A] Found corrupted API URL in localStorage, resetting to default');
            localStorage.setItem(CLIENT_API_KEY, '/api');
        }
    })();

    // Initialize new architecture on page load
    document.addEventListener('DOMContentLoaded', async () => {
        // Force adapter installation (replaces legacy globals)
        window.FORCE_SESSION_STORE = true;

        // Wait for dynamically loaded modules to be available
        await waitForModules();

        // Initialize core systems
        if (window.SessionStore) SessionStore.init();
        if (window.TransportManager) TransportManager.init();
        if (window.PanelManager) await PanelManager.init().syncWithSessionStore();
        if (window.TaskCreator) TaskCreator.init();

        // Restore previous session if available
        try {
            const hasSaved = await SessionStore.hasSavedSession();
            if (hasSaved) {
                const restored = await SessionStore.restoreAndReconnect();
                if (restored) {
                    console.log('[A2A] Session restored from storage');

                    // Re-open task panel if there was an active session
                    const state = SessionStore.getState();
                    if (state.sessionId && state.execute && window.TaskFlow) {
                        window.TaskFlow.restorePanel(state);
                    }
                }
            }
        } catch (error) {
            console.warn('[A2A] Failed to check/restore session:', error);
        }

        console.log('[A2A] Unified architecture initialized');
    });

    // Wait for dynamically loaded modules
    function waitForModules() {
        return new Promise((resolve) => {
            const check = () => {
                const transportReady = window._transportModulesLoaded || typeof window.TransportManager !== 'undefined';
                const appReady = window._appModulesLoaded || typeof window.SessionManager !== 'undefined';
                const panelReady = typeof window.Panel !== 'undefined' && typeof window.PanelManager !== 'undefined';

                if (transportReady && appReady && panelReady) {
                    resolve();
                } else {
                    setTimeout(check, 50);
                }
            };
            check();
        });
    }
</script>
