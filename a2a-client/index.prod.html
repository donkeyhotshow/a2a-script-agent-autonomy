<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    connect-src 'self' ws://localhost:* wss://localhost:* http://localhost:* https://localhost:*;
    font-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
    upgrade-insecure-requests;
  ">
  
  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  
  <!-- Performance -->
  <meta name="description" content="A2A Script Agent - AI-powered coding assistant">
  <link rel="preconnect" href="/">
  
  <title>A2A Script Agent</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  
  <!-- Error Tracking (placeholder for Sentry) -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error('Global error:', { msg, url, line, col, error });
      // Send to error tracking service
      if (window.ErrorReporter) {
        window.ErrorReporter.capture(error || msg);
      }
      return false;
    };
    
    window.onunhandledrejection = function(event) {
      console.error('Unhandled promise rejection:', event.reason);
      if (window.ErrorReporter) {
        window.ErrorReporter.capture(event.reason);
      }
    };
  </script>
</body>
</html>
