name: admin-app CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  php-backend:
    name: PHP backend (Laravel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - name: Install dependencies (composer)
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Generate app key
        run: php artisan key:generate --no-interaction || true
      - name: PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ]; then vendor/bin/phpunit --colors=always; else echo "No phpunit"; fi

  node-frontend:
    name: Node frontend (Vite + Vue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Lint (eslint)
        run: |
          if [ -f .eslintrc.cjs ] || [ -f .eslintrc.js ]; then npx eslint . --ext .js,.vue || true; else echo "No eslint config"; fi
      - name: Build
        run: npm run build
