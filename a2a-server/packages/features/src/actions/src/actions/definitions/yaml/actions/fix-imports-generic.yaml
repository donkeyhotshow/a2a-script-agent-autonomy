# Action: fix-imports-generic
# Generic import fixer that works with any JavaScript/TypeScript project

id: fix-imports-generic
version: "1.0"
title: "Исправить импорты (Generic)"
description: "Универсальное исправление сломанных импортов в JS/TS проектах. Работает с любыми фреймворками."

# Use mixins
mixins:
  - file-collector
  - code-analyzer
  - patch-applier

# Context requirements
context:
  language: typescript
  supports:
    - javascript
    - typescript
    - vue
    - react

# Triggers for semantic search
triggers:
  - fix imports
  - resolve imports
  - broken imports
  - fix import paths
  - cannot find module
  - module not found
  - исправить импорты
  - сломанные импорты
  - не найден модуль

# Configuration
config:
  supported_extensions:
    - .ts
    - .tsx
    - .js
    - .jsx
    - .vue
    - .mjs
  resolve_strategies:
    - extension_addition
    - index_resolution
    - alias_resolution
    - relative_path_fix

# Steps execution pipeline
steps:
  - id: collect-files
    description: "Collect all source files"
    $mixin: file-collector
    input:
      rootDir: "${context.rootDir}"
      extensions:
        - .ts
        - .tsx
        - .js
        - .jsx
        - .vue
      exclude:
        - node_modules
        - dist
        - build
        - .git
    output: files

  - id: find-imports
    description: "Find all import statements"
    $mixin: code-analyzer
    input:
      files: "{{ collect-files.files }}"
      pattern: "(?:from\\s+|require\\s*\\(\\s*)['\"]([^'\"]+)['\"]"
      flags: gm
    output: import_statements

  - id: analyze-imports
    description: "Analyze imports and detect broken ones"
    script: |
      import { existsSync } from 'node:fs';
      import { dirname, resolve, join } from 'node:path';

      interface ImportMatch {
        file: string;
        line: number;
        column: number;
        content: string;
        match: string;
        specifier: string;
      }

      interface BrokenImport extends ImportMatch {
        reason: string;
      }

      interface Input {
        import_statements: {
          matches: ImportMatch[];
        };
        aliases?: Record<string, string>;
      }

      interface Output {
        broken_imports: BrokenImport[];
        stats: {
          total: number;
          broken: number;
          packages: number;
        };
      }

      const IMPORT_RE = /(?:from\s+|require\s*\(\s*)['"]([^'"]+)['"]/;

      function stripQuery(s: string): string {
        return s.replace(/[?#].*$/, '');
      }

      function isPackageImport(spec: string): boolean {
        if (spec.startsWith('.')) return false;
        if (spec.startsWith('@/')) return false;
        if (/^@(components|utils|lib|features|app|src)\//.test(spec)) return false;
        if (/^@[\w-]+\//.test(spec)) return true;
        if (spec.startsWith('#')) return true;
        if (spec.startsWith('~')) return true;
        return !spec.includes('/');
      }

      function resolveExists(p: string): boolean {
        if (existsSync(p)) return true;
        for (const ext of ['.ts', '.tsx', '.js', '.jsx', '.vue', '/index.ts', '/index.js']) {
          if (existsSync(p + ext)) return true;
        }
        return false;
      }

      function tryResolveAlias(spec: string, aliases: Record<string, string>): string | null {
        for (const [alias, path] of Object.entries(aliases)) {
          if (spec.startsWith(alias)) {
            const suffix = spec.slice(alias.length);
            return resolve(path, suffix);
          }
        }
        return null;
      }

      export default async function run(input: Input): Promise<Output> {
        const { import_statements, aliases = {} } = input;
        const matches = import_statements?.matches || [];
        const broken: BrokenImport[] = [];
        let packageCount = 0;

        for (const match of matches) {
          const importMatch = match.match.match(IMPORT_RE);
          if (!importMatch) continue;

          const spec = stripQuery(importMatch[1] || '');

          // Skip package imports (we don't validate npm packages)
          if (isPackageImport(spec)) {
            packageCount++;
            continue;
          }

          // Try to resolve
          let resolved: string | null = null;

          if (spec.startsWith('.')) {
            // Relative import
            const fromDir = dirname(match.file);
            resolved = resolve(fromDir, spec);
            if (!resolveExists(resolved)) {
              broken.push({
                ...match,
                specifier: spec,
                reason: 'File not found'
              });
            }
          } else {
            // Try alias resolution
            resolved = tryResolveAlias(spec, aliases);
            if (resolved && !resolveExists(resolved)) {
              broken.push({
                ...match,
                specifier: spec,
                reason: 'Alias target not found'
              });
            } else if (!resolved) {
              // Unknown import type
              broken.push({
                ...match,
                specifier: spec,
                reason: 'Cannot resolve import'
              });
            }
          }
        }

        return {
          broken_imports: broken,
          stats: {
            total: matches.length,
            broken: broken.length,
            packages: packageCount
          }
        };
      }
    input:
      import_statements: "{{ find-imports.import_statements }}"
      aliases: "${context.aliases}"
    output: analysis

  - id: generate-patches
    description: "Generate patches for broken imports"
    script: |
      import { existsSync, readdirSync } from 'node:fs';
      import { dirname, resolve, relative, join, extname, basename } from 'node:path';

      interface BrokenImport {
        file: string;
        line: number;
        specifier: string;
        match: string;
        reason: string;
      }

      interface Patch {
        file: string;
        line: number;
        type: 'replace';
        search: string;
        replace: string;
        description: string;
      }

      interface Input {
        analysis: {
          broken_imports: BrokenImport[];
        };
        projectFiles?: string[];
      }

      interface Output {
        patches: Patch[];
        suggestions: string[];
      }

      function findCandidates(rootDir: string, baseName: string): string[] {
        const candidates: string[] = [];

        function walk(dir: string) {
          if (!existsSync(dir)) return;
          try {
            const entries = readdirSync(dir, { withFileTypes: true });
            for (const entry of entries) {
              const fullPath = join(dir, entry.name);
              if (entry.name === 'node_modules') continue;
              if (entry.isDirectory()) {
                walk(fullPath);
              } else if (entry.isFile()) {
                const ext = extname(entry.name);
                const name = basename(entry.name, ext);
                if (name === baseName && ['.ts', '.tsx', '.js', '.jsx', '.vue'].includes(ext)) {
                  candidates.push(fullPath);
                }
              }
            }
          } catch {
            // Ignore permission errors
          }
        }

        walk(rootDir);
        return candidates;
      }

      function tryResolveWithExtension(basePath: string): string | null {
        if (existsSync(basePath)) return basePath;
        for (const ext of ['.ts', '.tsx', '.js', '.jsx', '.vue']) {
          if (existsSync(basePath + ext)) return basePath + ext;
        }
        if (existsSync(join(basePath, 'index.ts'))) return join(basePath, 'index.ts');
        if (existsSync(join(basePath, 'index.js'))) return join(basePath, 'index.js');
        return null;
      }

      function toRelativeImport(fromFile: string, toFile: string): string {
        const fromDir = dirname(fromFile);
        let relPath = relative(fromDir, toFile).replace(/\\/g, '/');
        if (!relPath.startsWith('.')) relPath = './' + relPath;
        // Remove extension for cleaner imports
        relPath = relPath.replace(/\.(ts|tsx|js|jsx|vue)$/, '');
        return relPath;
      }

      export default async function run(input: Input): Promise<Output> {
        const { analysis, projectFiles = [] } = input;
        const brokenImports = analysis?.broken_imports || [];
        const patches: Patch[] = [];
        const suggestions: string[] = [];

        for (const imp of brokenImports) {
          const fromDir = dirname(imp.file);
          const spec = imp.specifier;

          // Strategy 1: Try adding extension
          if (!spec.match(/\.(ts|tsx|js|jsx|vue)$/)) {
            const resolved = tryResolveWithExtension(resolve(fromDir, spec));
            if (resolved) {
              const newSpec = toRelativeImport(imp.file, resolved);
              patches.push({
                file: imp.file,
                line: imp.line,
                type: 'replace',
                search: imp.match,
                replace: imp.match.replace(spec, newSpec),
                description: `Fix import path: ${spec} → ${newSpec}`
              });
              continue;
            }
          }

          // Strategy 2: Find by filename
          const baseName = spec.split('/').pop() || '';
          if (baseName) {
            const candidates = findCandidates(process.cwd(), baseName);
            if (candidates.length === 1) {
              const newSpec = toRelativeImport(imp.file, candidates[0]);
              patches.push({
                file: imp.file,
                line: imp.line,
                type: 'replace',
                search: imp.match,
                replace: imp.match.replace(spec, newSpec),
                description: `Fix import path: ${spec} → ${newSpec}`
              });
            } else if (candidates.length > 1) {
              suggestions.push(
                `${imp.file}:${imp.line} - Multiple candidates for "${spec}": ${candidates.map(c => relative(process.cwd(), c)).join(', ')}`
              );
            }
          }
        }

        return { patches, suggestions };
      }
    input:
      analysis: "{{ analyze-imports.analysis }}"
      projectFiles: "{{ collect-files.files }}"
    output: patch_data

  - id: confirm-patches
    description: "Confirm patches with user"
    script: |
      interface Input {
        patch_data: {
          patches: Array<{
            file: string;
            line: number;
            description: string;
          }>;
          suggestions: string[];
        };
      }

      interface Output {
        confirmed: boolean;
        patches_to_apply: Input['patch_data']['patches'];
      }

      export default async function run(input: Input): Promise<Output> {
        const { patch_data } = input;

        // In real implementation, this would show UI for confirmation
        // For now, auto-confirm if patches exist
        const hasPatches = patch_data?.patches?.length > 0;

        return {
          confirmed: hasPatches,
          patches_to_apply: patch_data?.patches || []
        };
      }
    input:
      patch_data: "{{ generate-patches.patch_data }}"
    output: confirmation

  - id: apply-patches
    description: "Apply confirmed patches"
    $mixin: patch-applier
    if: "{{ confirmation.confirmed }}"
    input:
      patches: "{{ confirmation.patches_to_apply }}"
      dryRun: "${context.dryRun}"
    output: results

  - id: generate-report
    description: "Generate final report"
    script: |
      interface Input {
        analysis: {
          stats: {
            total: number;
            broken: number;
            packages: number;
          };
        };
        patch_data: {
          suggestions: string[];
        };
        confirmation: {
          confirmed: boolean;
        };
        results?: {
          applied: number;
          failed: number;
        };
      }

      interface Output {
        report: {
          summary: string;
          details: {
            total_imports: number;
            broken_found: number;
            fixed: number;
            suggestions: string[];
          };
        };
      }

      export default async function run(input: Input): Promise<Output> {
        const { analysis, patch_data, confirmation, results } = input;

        return {
          report: {
            summary: `Analyzed ${analysis.stats.total} imports, found ${analysis.stats.broken} broken, fixed ${results?.applied || 0}.`,
            details: {
              total_imports: analysis.stats.total,
              broken_found: analysis.stats.broken,
              fixed: results?.applied || 0,
              suggestions: patch_data?.suggestions || []
            }
          }
        };
      }
    input:
      analysis: "{{ analyze-imports.analysis }}"
      patch_data: "{{ generate-patches.patch_data }}"
      confirmation: "{{ confirmation.confirmation }}"
      results: "{{ apply-patches.results }}"
    output: final_report
