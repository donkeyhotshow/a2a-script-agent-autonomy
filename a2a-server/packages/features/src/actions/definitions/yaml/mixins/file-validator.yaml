# Mixin: file-validator
# Validate files before processing - check existence, permissions, format

mixin: file-validator
description: "Validate files before processing - checks existence, permissions, and format"
version: "1.0"

# Input schema
input:
  files:
    type: array
    description: "Array of file paths to validate"
  checkExistence:
    type: boolean
    optional: true
    description: "Check if files exist"
  checkPermissions:
    type: boolean
    optional: true
    description: "Check read/write permissions"
  allowedExtensions:
    type: array
    optional: true
    description: "List of allowed file extensions"
  maxFileSize:
    type: number
    optional: true
    description: "Maximum file size in bytes"
  encoding:
    type: string
    optional: true
    description: "Expected file encoding"

# Output schema
output:
  valid:
    type: array
    description: "Array of valid file paths"
  invalid:
    type: array
    description: "Array of invalid files with error reasons"
  stats:
    type: object
    description: "Validation statistics"

# Default implementation
script: |
  import { existsSync, accessSync, constants, statSync } from 'node:fs';
  import { extname } from 'node:path';

  interface ValidationError {
    file: string;
    error: string;
    code: 'not_found' | 'no_read' | 'no_write' | 'invalid_extension' | 'too_large' | 'encoding_error';
  }

  interface ValidationStats {
    total: number;
    valid: number;
    invalid: number;
    byError: Record<string, number>;
  }

  interface Input {
    files: string[];
    checkExistence?: boolean;
    checkPermissions?: boolean;
    allowedExtensions?: string[];
    maxFileSize?: number;
    encoding?: string;
  }

  interface Output {
    valid: string[];
    invalid: ValidationError[];
    stats: ValidationStats;
  }

  export default async function run(input: Input): Promise<Output> {
    const {
      files,
      checkExistence = true,
      checkPermissions = false,
      allowedExtensions,
      maxFileSize,
      encoding = 'utf-8'
    } = input;

    const valid: string[] = [];
    const invalid: ValidationError[] = [];
    const byError: Record<string, number> = {};

    for (const file of files) {
      const errors: ValidationError[] = [];

      // Check existence
      if (checkExistence) {
        if (!existsSync(file)) {
          errors.push({
            file,
            error: `File not found: ${file}`,
            code: 'not_found'
          });
        }
      }

      // If file doesn't exist, skip other checks
      if (errors.length > 0) {
        invalid.push(...errors);
        errors.forEach(e => {
          byError[e.code] = (byError[e.code] || 0) + 1;
        });
        continue;
      }

      // Check permissions
      if (checkPermissions) {
        try {
          accessSync(file, constants.R_OK);
        } catch {
          errors.push({
            file,
            error: `No read permission for: ${file}`,
            code: 'no_read'
          });
        }
      }

      // Check extension
      if (allowedExtensions && allowedExtensions.length > 0) {
        const ext = extname(file).toLowerCase();
        const normalizedAllowed = allowedExtensions.map(e =>
          e.startsWith('.') ? e.toLowerCase() : `.${e.toLowerCase()}`
        );
        if (!normalizedAllowed.includes(ext)) {
          errors.push({
            file,
            error: `Invalid extension "${ext}". Allowed: ${allowedExtensions.join(', ')}`,
            code: 'invalid_extension'
          });
        }
      }

      // Check file size
      if (maxFileSize) {
        try {
          const stats = statSync(file);
          if (stats.size > maxFileSize) {
            errors.push({
              file,
              error: `File too large: ${stats.size} bytes (max: ${maxFileSize})`,
              code: 'too_large'
            });
          }
        } catch {
          // Ignore stat errors (already caught by existence check)
        }
      }

      // Record errors or mark as valid
      if (errors.length > 0) {
        invalid.push(...errors);
        errors.forEach(e => {
          byError[e.code] = (byError[e.code] || 0) + 1;
        });
      } else {
        valid.push(file);
      }
    }

    return {
      valid,
      invalid,
      stats: {
        total: files.length,
        valid: valid.length,
        invalid: invalid.length,
        byError
      }
    };
  }
