# Action: ai-session-context
# AI Session Context System - сохранение и использование контекста из предыдущих сессий

id: ai-session-context
version: "1.0"
title: "AI Session Context"
description: "Система для сохранения и использования контекста из предыдущих сессий при работе с новыми задачами"

# Use mixins
mixins:
  - file-collector
  - code-analyzer

# Context requirements
context:
  type: session_context
  creates_files: true
  llm_guided: true
  iterations: multiple

# Triggers for semantic search
triggers:
  - сохрани контекст
  - запомни
  - new session
  - new task context
  - создай сессию
  - контекст изучения
  - план изучения
  - ai session
  - ai context

# Priority for matching
priority: 90

# Steps execution pipeline
steps:
  - id: capture-task
    description: "Захват входящей задачи"
    script: |
      interface Input {
        userMessage: string;
        sessionId: string;
      }

      interface CapturedTask {
        id: string;
        session_id: string;
        original_message: string;
        created_at: string;
        status: string;
        iterations: number;
      }

      interface Output {
        captured_task: CapturedTask;
      }

      export default async function run(input: Input): Promise<Output> {
        const task: CapturedTask = {
          id: `task_${Date.now()}`,
          session_id: input.sessionId,
          original_message: input.userMessage,
          created_at: new Date().toISOString(),
          status: 'captured',
          iterations: 0
        };

        return { captured_task: task };
      }
    input:
      userMessage: "${context.userMessage}"
      sessionId: "${context.sessionId}"
    output: captured_task

  - id: analyze-intent
    description: "Анализ намерения и типа задачи"
    script: |
      interface Input {
        captured_task: {
          original_message: string;
        };
      }

      interface IntentAnalysis {
        task_type: string;
        complexity: string;
        requires_analysis: boolean;
        keywords: string[];
      }

      interface Output {
        intent_analysis: IntentAnalysis;
      }

      export default async function run(input: Input): Promise<Output> {
        const message = input.captured_task.original_message.toLowerCase();

        // Определяем тип задачи
        let taskType = 'general';
        let complexity = 'medium';
        const requiresAnalysis = true;

        const typePatterns: Record<string, string[]> = {
          create: ['создай', 'добавь', 'new', 'create', 'generate'],
          analyze: ['анализ', 'проверь', 'найди проблемы', 'analyze', 'check'],
          fix: ['исправь', 'почини', 'fix', 'resolve'],
          refactor: ['рефакторинг', 'улучши', 'refactor', 'improve'],
          explain: ['объясни', 'расскажи', 'покажи', 'explain', 'show'],
          search: ['найди', 'поиск', 'search', 'find']
        };

        for (const [type, patterns] of Object.entries(typePatterns)) {
          if (patterns.some(p => message.includes(p))) {
            taskType = type;
            break;
          }
        }

        // Определяем сложность
        if (message.includes('архитектур') || message.includes('architecture')) {
          complexity = 'high';
        } else if (message.length > 500) {
          complexity = 'medium';
        }

        return {
          intent_analysis: {
            task_type: taskType,
            complexity,
            requires_analysis: requiresAnalysis,
            keywords: message.split(/\s+/).filter(w => w.length > 3)
          }
        };
      }
    input:
      captured_task: "{{ capture-task.captured_task }}"
    output: intent_analysis

  - id: collect-session-context
    description: "Сбор контекста из предыдущих сессий"
    script: |
      interface Input {
        intent_analysis: {
          keywords: string[];
          previous_contexts?: Array<{
            keywords?: string[];
            session_id?: string;
          }>;
          related_session?: string;
        };
        projectId?: string;
      }

      interface SessionContext {
        previous_sessions: Array<Record<string, unknown>>;
        has_history: boolean;
        context_summary: string;
      }

      interface Output {
        session_context: SessionContext;
      }

      export default async function run(input: Input): Promise<Output> {
        // Контекст передаётся от клиента в incoming context
        // Сервер не хранит, только обрабатывает переданное

        const previousContexts = input.intent_analysis.previous_contexts || [];
        const relevantHistory: Array<Record<string, unknown>> = [];

        // Ищем релевантный контекст из предыдущих сессий
        for (const ctx of previousContexts) {
          // Простой поиск по ключевым словам
          const hasOverlap = ctx.keywords?.some(
            k => input.intent_analysis.keywords.includes(k)
          );
          if (hasOverlap || ctx.session_id === input.intent_analysis.related_session) {
            relevantHistory.push(ctx);
          }
        }

        return {
          session_context: {
            previous_sessions: relevantHistory,
            has_history: relevantHistory.length > 0,
            context_summary: relevantHistory.map(c => (c as {summary?: string}).summary).filter(Boolean).join('\n')
          }
        };
      }
    input:
      intent_analysis: "{{ analyze-intent.intent_analysis }}"
      projectId: "${context.projectId}"
    output: session_context

  - id: create-learning-plan
    description: "Создание плана изучения проблемы"
    script: |
      interface Input {
        captured_task: {
          id: string;
          original_message: string;
        };
        intent_analysis: {
          task_type: string;
          complexity: string;
        };
        session_context: {
          has_history: boolean;
          context_summary: string;
        };
      }

      interface LearningStep {
        order: number;
        description: string;
        estimated_time: string;
        deliverable: string;
      }

      interface LearningPlan {
        task_id: string;
        overview: string;
        steps: LearningStep[];
        estimated_total_time: string;
        context_used: boolean;
      }

      interface Output {
        learning_plan: LearningPlan;
      }

      export default async function run(input: Input): Promise<Output> {
        const { captured_task, intent_analysis, session_context } = input;

        // Формируем шаги плана в зависимости от типа задачи
        const steps: LearningStep[] = [];

        // Шаг 1: Первичный анализ
        steps.push({
          order: 1,
          description: 'Изучить структуру проекта и ключевые файлы',
          estimated_time: '5-10 мин',
          deliverable: 'Краткое описание архитектуры проекта'
        });

        // Шаг 2: Анализ связанных файлов
        if (intent_analysis.task_type === 'fix' || intent_analysis.task_type === 'refactor') {
          steps.push({
            order: 2,
            description: 'Найти и проанализировать файлы, связанные с проблемой',
            estimated_time: '10-15 мин',
            deliverable: 'Список связанных файлов и их назначение'
          });
          steps.push({
            order: 3,
            description: 'Определить причину проблемы и варианты решения',
            estimated_time: '10-15 мин',
            deliverable: 'Описание проблемы и предложенные решения'
          });
        } else if (intent_analysis.task_type === 'create') {
          steps.push({
            order: 2,
            description: 'Изучить существующие подобные реализации в проекте',
            estimated_time: '5-10 мин',
            deliverable: 'Примеры похожего кода в проекте'
          });
          steps.push({
            order: 3,
            description: 'Спроектировать решение с учетом существующих паттернов',
            estimated_time: '10-15 мин',
            deliverable: 'План реализации с учетом архитектуры проекта'
          });
        } else if (intent_analysis.task_type === 'analyze') {
          steps.push({
            order: 2,
            description: 'Провести детальный анализ указанных файлов',
            estimated_time: '15-20 мин',
            deliverable: 'Отчет об анализе с найденными проблемами'
          });
        }

        // Шаг 4: Финальное решение
        steps.push({
          order: steps.length + 1,
          description: 'Сформулировать итоговое решение или рекомендации',
          estimated_time: '5-10 мин',
          deliverable: 'Итоговый ответ или план действий'
        });

        // Рассчитываем общее время
        const totalMinutes = steps.length * 10;
        const estimated_total_time = totalMinutes > 60
          ? `${Math.ceil(totalMinutes / 60)} ч`
          : `${totalMinutes} мин`;

        return {
          learning_plan: {
            task_id: captured_task.id,
            overview: `План изучения для задачи: ${captured_task.original_message.substring(0, 100)}...`,
            steps,
            estimated_total_time,
            context_used: session_context.has_history
          }
        };
      }
    input:
      captured_task: "{{ capture-task.captured_task }}"
      intent_analysis: "{{ analyze-intent.intent_analysis }}"
      session_context: "{{ collect-session-context.session_context }}"
    output: learning_plan

  - id: save-context-document
    description: "Сохранение контекстного документа"
    $mixin: file-collector
    input:
      rootDir: "${context.outputDir}"
      extensions:
        - .md
      createIfMissing: true
    output: context_document
