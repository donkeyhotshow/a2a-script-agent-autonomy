# Mixin: file-collector
# Collect files by extensions from directory tree

mixin: file-collector
description: "Recursively collect files matching extensions"
version: 1.0

# Input schema
input:
  rootDir:
    type: string
    description: "Root directory to scan"
  extensions:
    type: array
    description: "File extensions to match (e.g., ['.ts', '.vue'])"
  exclude:
    type: array
    optional: true
    description: "Patterns to exclude (e.g., ['node_modules', '.git'])"

# Output schema
output:
  files:
    type: array
    description: "Array of absolute file paths"

# Default implementation
script: |
  import { readdirSync, existsSync } from 'node:fs';
  import { join, relative } from 'node:path';

  interface Input {
    rootDir: string;
    extensions: string[];
    exclude?: string[];
  }

  interface Output {
    files: string[];
  }

  const DEFAULT_EXCLUDE = ['node_modules', '.git', 'dist', 'build', '.nuxt', '.output'];

  export default async function run(input: Input): Promise<Output> {
    const files: string[] = [];
    const exclude = input.exclude || DEFAULT_EXCLUDE;
    
    function shouldExclude(path: string): boolean {
      return exclude.some(ex => path.includes(ex));
    }

    function scan(dir: string): void {
      if (!existsSync(dir)) return;
      if (shouldExclude(dir)) return;

      const entries = readdirSync(dir, { withFileTypes: true });
      
      for (const entry of entries) {
        const fullPath = join(dir, entry.name);
        
        if (entry.isDirectory()) {
          scan(fullPath);
        } else if (entry.isFile()) {
          const ext = '.' + entry.name.split('.').pop();
          if (input.extensions.includes(ext)) {
            files.push(fullPath);
          }
        }
      }
    }

    scan(input.rootDir);
    
    return { files };
  }
