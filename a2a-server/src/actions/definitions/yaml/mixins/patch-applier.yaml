# Mixin: patch-applier
# Apply patches to files

mixin: patch-applier
description: "Apply code patches to files"
version: 1.0

# Input schema
input:
  patches:
    type: array
    description: "Array of patches to apply"
  dryRun:
    type: boolean
    optional: true
    description: "If true, don't actually apply patches"

# Output schema
output:
  applied:
    type: number
    description: "Number of patches applied"
  failed:
    type: array
    description: "Array of failed patch applications"
  results:
    type: array
    description: "Detailed results for each patch"

# Default implementation
script: |
  import { readFileSync, writeFileSync, existsSync } from 'node:fs';

  interface Patch {
    file: string;
    type: 'replace' | 'insert' | 'delete';
    search?: string;
    replace?: string;
    line?: number;
  }

  interface Input {
    patches: Patch[];
    dryRun?: boolean;
  }

  interface Output {
    applied: number;
    failed: { patch: Patch; error: string }[];
    results: { patch: Patch; success: boolean }[];
  }

  export default async function run(input: Input): Promise<Output> {
    const results: Output['results'] = [];
    const failed: Output['failed'] = [];
    let applied = 0;

    for (const patch of input.patches) {
      try {
        if (!existsSync(patch.file)) {
          throw new Error(`File not found: ${patch.file}`);
        }

        const content = readFileSync(patch.file, 'utf-8');
        let newContent = content;

        switch (patch.type) {
          case 'replace':
            if (patch.search && patch.replace) {
              newContent = content.replace(patch.search, patch.replace);
            }
            break;
            
          case 'insert':
            if (patch.line !== undefined && patch.replace) {
              const lines = content.split('\n');
              lines.splice(patch.line, 0, patch.replace);
              newContent = lines.join('\n');
            }
            break;
            
          case 'delete':
            if (patch.search) {
              newContent = content.replace(patch.search, '');
            }
            break;
        }

        if (!input.dryRun) {
          writeFileSync(patch.file, newContent, 'utf-8');
        }

        results.push({ patch, success: true });
        applied++;
        
      } catch (error) {
        const errorMessage = error instanceof Error ? error.message : String(error);
        failed.push({ patch, error: errorMessage });
        results.push({ patch, success: false });
      }
    }

    return { applied, failed, results };
  }
