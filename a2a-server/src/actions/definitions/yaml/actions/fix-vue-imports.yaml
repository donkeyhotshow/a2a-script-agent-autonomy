# Action: fix-vue-imports
# Fix broken imports in Vue files

id: fix-vue-imports
version: 1.0
description: "Find and fix broken imports in Vue/TS files"

# Use mixins
mixins:
  - file-collector
  - code-analyzer
  - patch-applier

# Context requirements
context:
  framework: vue
  build-tool: vite

# Triggers for semantic search
triggers:
  - fix vue imports
  - resolve import issues
  - broken imports
  - fix import paths

# Steps pipeline
steps:
  - id: collect
    description: "Collect Vue and TypeScript files"
    $mixin: file-collector
    input:
      rootDir: "${context.rootDir}"
      extensions:
        - .vue
        - .ts
        - .tsx
    output: files

  - id: analyze
    description: "Find import statements"
    $mixin: code-analyzer
    input:
      files: "{{ collect.files }}"
      pattern: "(?:from\\s+|require\\s*\\()['\"]([^'\"]+)['\"]"
      flags: gm
    output: import_matches

  - id: detect
    description: "Detect broken imports"
    script: |
      interface Input {
        import_matches: Array<{
          file: string;
          line: number;
          match: string;
        }>;
      }
      
      interface Output {
        broken_imports: Array<{
          file: string;
          line: number;
          specifier: string;
        }>;
      }
      
      interface BrokenImport {
        file: string;
        line: number;
        specifier: string;
      }
      
      export default async function run(input: Input): Promise<Output> {
        const broken: BrokenImport[] = [];
        
        for (const match of input.import_matches) {
          const spec = match.match
            .replace(/from\s+/, '')
            .replace(/require\s*\(/, '')
            .replace(/['"]/g, '');
          
          // Skip package imports
          if (!spec.startsWith('.')) continue;
          if (spec.startsWith('@/')) continue;
          
          // Mark as potentially broken - in real implementation,
          // would check if file exists
          broken.push({
            file: match.file,
            line: match.line,
            specifier: spec,
          });
        }
        
        return { broken_imports: broken };
      }
    input:
      import_matches: "{{ import_matches }}"
    output: broken_imports

  - id: resolve
    description: "Generate patches for broken imports"
    script: |
      interface BrokenImport {
        file: string;
        line: number;
        specifier: string;
      }
      
      interface Input {
        broken_imports: BrokenImport[];
      }
      
      interface Patch {
        file: string;
        type: 'replace';
        search: string;
        replace: string;
      }
      
      interface Output {
        patches: Patch[];
      }
      
      export default async function run(input: Input): Promise<Output> {
        const patches: Patch[] = [];
        
        for (const broken of input.broken_imports) {
          // Generate fix - simplified version
          // In real implementation, would resolve actual path
          const fixedSpecifier = broken.specifier;
          
          patches.push({
            file: broken.file,
            type: 'replace',
            search: broken.specifier,
            replace: fixedSpecifier,
          });
        }
        
        return { patches };
      }
    input:
      broken_imports: "{{ broken_imports }}"
    output: patches

  - id: apply
    description: "Apply patches to fix imports"
    $mixin: patch-applier
    input:
      patches: "{{ patches }}"
      dryRun: false
    output: applied_result
