version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: a2a-postgres
    environment:
      POSTGRES_USER: a2a
      POSTGRES_PASSWORD: a2a_secret
      POSTGRES_DB: a2a_server
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U a2a -d a2a_server" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - a2a-network

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: a2a-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - a2a-network

  # AI Proxy Service
  ai-proxy:
    build:
      context: ../ai-integration
      dockerfile: Dockerfile
    container_name: a2a-ai-proxy
    ports:
      - "11434:11434"
    environment:
      - PROXY_PORT=11434
      - PROXY_HOST=0.0.0.0
      - OLLAMA_HOST=http://host.docker.internal:11435
      - OLLAMA_MODEL=llama3
      - OLLAMA_TIMEOUT=60
      - OLLAMA_AUTO_START=false
      - STORAGE_DIR=/app/proxy_logs
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - HEALTH_CHECK_INTERVAL=5
    volumes:
      - ai_proxy_logs:/app/proxy_logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - a2a-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A2A Server Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a2a-server
    environment:
      DATABASE_URL: postgresql://a2a:a2a_secret@postgres:5432/a2a_server?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: dev-secret-change-in-production
      PROXY_BASE_URL: http://ai-proxy:11434
    ports:
      - "3000:3000"
      - "3001:3001"  # WebSocket
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-proxy:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./repos:/app/repos
      - ./file_cache:/app/file_cache
      - ./ssh_keys:/app/ssh_keys
    networks:
      - a2a-network
    command: npm run dev

  # Optional: Plexe ML Server (if running locally)
  # plexe:
  #   image: plexe/plexe-server:latest
  #   container_name: a2a-plexe
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - plexe_models:/models
  #   networks:
  #     - a2a-network

volumes:
  postgres_data:
  redis_data:
  ai_proxy_logs:
  # plexe_models:

networks:
  a2a-network:
    driver: bridge
