[package]
name = "a2a-runtime"
version = "0.1.0"
edition = "2021"
description = "Session state management via N-API (ADR-ClawCode §14.4)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# N-API bindings — exposes Rust functions to Node.js
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"

# Fast serialisation for session context blobs
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
