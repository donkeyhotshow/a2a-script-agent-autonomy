[package]
name = "a2a-parser"
version = "0.1.0"
edition = "2021"
description = "Message parsing < 0.1 ms via N-API (ADR-ClawCode §14.4)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
