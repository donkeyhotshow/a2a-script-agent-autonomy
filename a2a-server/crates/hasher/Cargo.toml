[package]
name = "a2a-hasher"
version = "0.1.0"
edition = "2021"
description = "Context SHA-256 hashing < 0.05 ms via N-API (ADR-ClawCode §14.4)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
napi-build = "2"
