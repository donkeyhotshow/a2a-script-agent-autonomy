<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; width: 100%; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .context { background: #f0f7ff; padding: 15px; border-radius: 6px; margin-bottom: 30px; color: #0066cc; font-size: 14px; }
        .question-title { font-size: 24px; font-weight: 600; margin-bottom: 25px; color: #333; line-height: 1.4; }
        .question-id { font-size: 12px; color: #999; margin-bottom: 10px; }
        input[type="text"], textarea, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; transition: border 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #0066cc; }
        textarea { min-height: 120px; resize: vertical; font-family: inherit; }
        .checkbox-group, .radio-group { display: flex; flex-direction: column; gap: 12px; }
        .checkbox-group label, .radio-group label { display: flex; align-items: center; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .checkbox-group label:hover, .radio-group label:hover { border-color: #0066cc; background: #f8fbff; }
        .checkbox-group input, .radio-group input { margin-right: 12px; width: 20px; height: 20px; cursor: pointer; }
        .actions { display: flex; gap: 12px; margin-top: 30px; }
        button { flex: 1; background: #0066cc; color: white; padding: 14px 30px; border: none; border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0052a3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .message { padding: 15px; border-radius: 6px; margin-bottom: 20px; display: none; font-weight: 500; }
        .message.success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="context" id="context"></div>
        <div class="message" id="message"></div>
        <div class="question-id" id="questionId"></div>
        <div class="question-title" id="questionTitle"></div>
        <form id="questionForm">
            <div id="inputContainer"></div>
            <div class="actions">
                <button type="submit" id="submitBtn">Save Answer</button>
            </div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const questionId = urlParams.get('id');
        const autoClose = urlParams.get('autoClose') === 'true';
        
        let questionsData = null;
        let currentQuestion = null;

        async function loadQuestion() {
            try {
                const response = await fetch('server.php');
                questionsData = await response.json();
                
                if (questionsData.error) {
                    showMessage('error', questionsData.error);
                    return;
                }

                currentQuestion = findQuestion(questionId);
                
                if (!currentQuestion) {
                    showMessage('error', `Question ${questionId} not found`);
                    return;
                }

                renderQuestion();
            } catch (error) {
                showMessage('error', 'Failed to load question: ' + error.message);
            }
        }

        function findQuestion(id) {
            for (const group of questionsData.groups || []) {
                const question = group.questions.find(q => q.id === id);
                if (question) return question;
            }
            return null;
        }

        function renderQuestion() {
            document.getElementById('context').textContent = questionsData.context || 'No context';
            document.getElementById('questionId').textContent = `ID: ${currentQuestion.id}`;
            document.getElementById('questionTitle').textContent = currentQuestion.question;
            
            const container = document.getElementById('inputContainer');
            
            switch (currentQuestion.type) {
                case 'text':
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.name = 'answer';
                    input.placeholder = currentQuestion.placeholder || '';
                    input.autofocus = true;
                    container.appendChild(input);
                    break;
                
                case 'textarea':
                    const textarea = document.createElement('textarea');
                    textarea.name = 'answer';
                    textarea.placeholder = currentQuestion.placeholder || '';
                    textarea.autofocus = true;
                    container.appendChild(textarea);
                    break;
                
                case 'select':
                    const select = document.createElement('select');
                    select.name = 'answer';
                    select.autofocus = true;
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = '-- Select --';
                    select.appendChild(defaultOption);
                    currentQuestion.options.forEach(opt => {
                        const option = document.createElement('option');
                        option.value = opt;
                        option.textContent = opt;
                        select.appendChild(option);
                    });
                    container.appendChild(select);
                    break;
                
                case 'multiselect':
                case 'checkbox':
                    const checkboxDiv = document.createElement('div');
                    checkboxDiv.className = 'checkbox-group';
                    currentQuestion.options.forEach(opt => {
                        const label = document.createElement('label');
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.name = 'answer';
                        checkbox.value = opt;
                        label.appendChild(checkbox);
                        label.appendChild(document.createTextNode(opt));
                        checkboxDiv.appendChild(label);
                    });
                    container.appendChild(checkboxDiv);
                    break;
                
                case 'radio':
                    const radioDiv = document.createElement('div');
                    radioDiv.className = 'radio-group';
                    currentQuestion.options.forEach(opt => {
                        const label = document.createElement('label');
                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = 'answer';
                        radio.value = opt;
                        label.appendChild(radio);
                        label.appendChild(document.createTextNode(opt));
                        radioDiv.appendChild(label);
                    });
                    container.appendChild(radioDiv);
                    break;
            }
        }

        document.getElementById('questionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            let answer;
            
            if (currentQuestion.type === 'multiselect' || currentQuestion.type === 'checkbox') {
                answer = formData.getAll('answer');
            } else {
                answer = formData.get('answer');
            }
            
            if (!answer || (Array.isArray(answer) && answer.length === 0)) {
                showMessage('error', 'Please provide an answer');
                return;
            }
            
            try {
                const response = await fetch('server.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: questionsData.sessionId,
                        questionId: currentQuestion.id,
                        answer: answer,
                        partial: true
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('success', 'Answer saved successfully!');
                    
                    if (autoClose) {
                        setTimeout(() => window.close(), 1000);
                    }
                } else {
                    showMessage('error', result.error || 'Failed to save answer');
                }
            } catch (error) {
                showMessage('error', 'Failed to save: ' + error.message);
            }
        });

        function showMessage(type, text) {
            const messageEl = document.getElementById('message');
            messageEl.className = 'message ' + type;
            messageEl.textContent = text;
            messageEl.style.display = 'block';
        }

        if (!questionId) {
            showMessage('error', 'No question ID provided');
        } else {
            loadQuestion();
        }
    </script>
</body>
</html>
