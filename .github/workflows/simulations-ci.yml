name: Simulations CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'simulations/**'
      - 'a2a-server/scripts/sim-*.ts'
      - 'a2a-server/package.json'
  pull_request:
    paths:
      - 'simulations/**'
      - 'a2a-server/scripts/sim-*.ts'
      - 'a2a-server/package.json'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Simulations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a2a-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: a2a-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run simulation lint
        run: npm run sim:lint:all
        continue-on-error: true

      - name: Report lint results
        run: |
          echo "## Simulation Lint Results" >> $GITHUB_STEP_SUMMARY
          if npm run sim:lint:all -- --json 2>&1 | grep -q '"valid":true'; then
            echo "✅ All simulations passed linting" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some simulations have lint issues" >> $GITHUB_STEP_SUMMARY
            npm run sim:lint:all || true
          fi

  validate:
    name: Validate Simulations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a2a-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: a2a-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run simulation validation
        run: npm run sim:validate:all
        continue-on-error: true

      - name: Report validation results
        run: |
          echo "## Simulation Validation Results" >> $GITHUB_STEP_SUMMARY
          if npm run sim:validate:all -- --json 2>&1 | grep -q '"valid":true'; then
            echo "✅ All simulations passed validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some simulations have validation errors" >> $GITHUB_STEP_SUMMARY
            npm run sim:validate:all || true
          fi

  test:
    name: Test Simulations
    runs-on: ubuntu-latest
    needs: [lint, validate]
    defaults:
      run:
        working-directory: a2a-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: a2a-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run simulation tests
        run: npm run test:sim:all
        continue-on-error: true

      - name: Report test results
        run: |
          echo "## Simulation Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed (see logs for details)" >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Simulation Quality Gate (clean)
    runs-on: ubuntu-latest
    needs: [lint, validate]
    defaults:
      run:
        working-directory: a2a-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: a2a-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce unified simulation acceptance rule
        run: npm run sim:quality

  scaffold-check:
    name: Check Scaffolding Works
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a2a-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: a2a-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test scaffold generation
        run: |
          # Create test simulation
          npm run sim:create -- --name test-scaffold-sim --steps 2 --force
          
          # Verify files exist
          if [ -f "simulations/test-scaffold-sim/description.md" ]; then
            echo "✅ Scaffold created description.md"
          else
            echo "❌ Scaffold failed to create description.md"
            exit 1
          fi
          
          if [ -f "simulations/test-scaffold-sim/1/request.json" ]; then
            echo "✅ Scaffold created step 1 files"
          else
            echo "❌ Scaffold failed to create step files"
            exit 1
          fi

      - name: Test lint on scaffolded simulation
        run: |
          npm run sim:lint -- --sim test-scaffold-sim

      - name: Test validate on scaffolded simulation
        run: |
          npm run sim:validate -- --sim test-scaffold-sim

      - name: Cleanup test simulation
        run: rm -rf simulations/test-scaffold-sim
        if: always()
