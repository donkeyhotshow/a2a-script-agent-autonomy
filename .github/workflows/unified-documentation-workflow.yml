# Scheduled / manual offline gates (legacy unified doc workflow removed — it depended on missing .clinerules/).
name: Repo validate (offline)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  repo-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Cross-system validate
        run: npm run cross-system:validate

      - name: Simulation markdown gate
        run: npm run sim:check-md:fail

      - name: Client integration tests (incl. web)
        working-directory: a2a-client
        run: |
          npm ci
          npm run test:web
