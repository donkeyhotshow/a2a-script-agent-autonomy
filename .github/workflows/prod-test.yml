name: Production Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode (all, client, server, ollama)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server
          - ollama
      label:
        description: 'Run label/tag'
        required: false
        default: ''
      skip_model_check:
        description: 'Skip Ollama model check'
        required: false
        type: boolean
        default: false
  schedule:
    # Run every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  # Also run on push to main/develop branches
  push:
    branches:
      - main
      - develop

env:
  OLLAMA_PORT: 11434
  PROXY_PORT: 11435
  SERVER_PORT: 3000
  CLIENT_API_PORT: 3001

jobs:
  prod-test:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          cd a2a-server && npm ci
          cd ../a2a-client/packages/sdk && npm ci
          
      - name: Check Ollama installation
        run: |
          if (Get-Command ollama -ErrorAction SilentlyContinue) {
            Write-Host "Ollama found"
          } else {
            Write-Host "Ollama not found - will skip Ollama tests"
          }
          
      - name: Start Ollama service
        if: false  # Ollama typically runs as a service on Windows
        run: |
          ollama serve &
          sleep 5
          
      - name: Start a2a-server
        run: |
          cd a2a-server
          $env:SKIP_AUTH="1"
          Start-Process -FilePath "npm" -ArgumentList "run dev" -NoNewWindow
        shell: pwsh
        
      - name: Start client-api
        run: |
          cd a2a-client/packages/sdk
          $env:PORT="3001"
          Start-Process -FilePath "npm" -ArgumentList "run dev" -NoNewWindow
        shell: pwsh
        
      - name: Wait for services to be ready
        run: |
          $maxRetries = 30
          $retryCount = 0
          
          # Wait for server
          while ($retryCount -lt $maxRetries) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3000/health" -TimeoutSec 2 -ErrorAction SilentlyContinue
              if ($response.StatusCode -eq 200) {
                Write-Host "Server is ready"
                break
              }
            } catch {}
            Start-Sleep -Seconds 2
            $retryCount++
          }
          
          if ($retryCount -ge $maxRetries) {
            Write-Host "Warning: Server health check timed out"
          }
          
          # Wait for client-api
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3001/health" -TimeoutSec 2 -ErrorAction SilentlyContinue
              if ($response.StatusCode -eq 200) {
                Write-Host "Client API is ready"
                break
              }
            } catch {}
            Start-Sleep -Seconds 2
            $retryCount++
          }
          
          if ($retryCount -ge $maxRetries) {
            Write-Host "Warning: Client API health check timed out"
          }
        shell: pwsh
        
      - name: Run prod-test
        id: prod-test
        run: |
          $mode = "${{ github.event.inputs.mode }}"
          if (-not $mode) { $mode = "all" }
          
          $args = @("--mode", $mode, "--no-prompt")
          
          if ("${{ github.event.inputs.skip_model_check }}" -eq "true") {
            $args += "--skip-model-check"
          }
          
          if ("${{ github.event.inputs.label }}") {
            $args += @("--label", "${{ github.event.inputs.label }}")
          }
          
          $env:SKIP_AUTH = "1"
          node scripts/prod-test.js @args
        shell: pwsh
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-test-results
          path: tmp/prod-test-results/
          retention-days: 30
          
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            *.log
            a2a-server/*.log
            a2a-client/packages/sdk/*.log
          retention-days: 7
          
      - name: Show test summary
        if: always()
        run: |
          $resultsPath = "tmp/prod-test-results"
          if (Test-Path $resultsPath) {
            Get-ChildItem $resultsPath -Directory | 
              Where-Object { $_.Name -match '^\d{8}T\d{6}' } | 
              Sort-Object LastWriteTime -Descending | 
              Select-Object -First 1 | 
              ForEach-Object {
                $summaryFile = Join-Path $_.FullName "summary.json"
                if (Test-Path $summaryFile) {
                  Write-Host "=== Test Summary ==="
                  Get-Content $summaryFile | ConvertFrom-Json | ConvertTo-Json -Depth 10
                }
              }
          }
        shell: pwsh
        
      - name: Fail if tests failed
        if: steps.prod-test.outcome == 'failure'
        run: |
          Write-Host "Prod-test failed! Check the artifacts for details."
          exit 1
