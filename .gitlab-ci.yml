# Offline validation (replaces legacy .clinerules workflow; see docs/DEV_STATE_ROOT.md).
stages:
  - validate

variables:
  NODE_VERSION: '20'

# Deterministic checks: no live stack, no .clinerules.
repo-validate:
  stage: validate
  image: node:${NODE_VERSION}
  before_script:
    - npm ci
  script:
    - npm run cross-system:validate
    - npm run sim:check-md:fail
    - cd a2a-client && npm ci && npm run test:web
  only:
    - main
    - develop
    - merge_requests
