documentation-cleanup:
  stage: documentation-workflow
  image: node:$NODE_VERSION
  before_script:
    - npm ci
  script:
    - echo "🧹 Starting documentation cleanup workflow..."
    - node .clinerules/scripts/workflow-engine.js --start --priority low
    - echo "⏳ Monitoring cleanup workflow progress..."
    
    # Monitor for up to 4 hours for cleanup workflows
    - |
      for i in {1..480}; do
        STATUS=$(node .clinerules/scripts/workflow-engine.js --status --json 2>/dev/null)
        if [ $? -eq 0 ]; then
          CURRENT_PHASE=$(echo "$STATUS" | jq -r '.current_phase')
          PROGRESS=$(echo "$STATUS" | jq -r '.progress_percentage')
          echo "Progress: $PROGRESS% - Phase: $CURRENT_PHASE"
          
          if [ "$CURRENT_PHASE" = "completed" ]; then
            echo "✅ Cleanup workflow completed successfully!"
            break
          fi
        fi
        
        if [ $i -eq 480 ]; then
          echo "❌ Cleanup workflow did not complete within 4 hours"
          exit 1
        fi
        
        sleep 30
      done
  when: manual
  only:
    - main
  environment:
    name: documentation-cleanup
  artifacts:
    paths:
      - .clinerules/
    expire_in: 1 week

