# RAG Tests CI/CD Pipeline
# 
# This workflow runs comprehensive tests for the RAG (Retrieval-Augmented Generation)
# package including functional tests, performance benchmarks, and accuracy validation.
#
# Triggers:
#   - Push to RAG package files
#   - Pull requests affecting RAG package
#   - Scheduled daily runs at 02:00 UTC
#   - Manual workflow dispatch
#
# Jobs:
#   - test: Run all tests with coverage (matrix: Node 18.x, 20.x)
#   - performance: Dedicated performance benchmarking with regression detection
#   - report: Aggregate results and publish reports

name: RAG Tests CI/CD

on:
  # Trigger on push to RAG package
  push:
    paths:
      - 'a2a-client/packages/rag/**'
      - '.github/workflows/rag-tests.yml'
    branches:
      - main
      - develop
      - 'feature/**'
  
  # Trigger on PRs affecting RAG
  pull_request:
    paths:
      - 'a2a-client/packages/rag/**'
    branches:
      - main
      - develop
  
  # Daily scheduled run at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      test_preset:
        description: 'Test configuration preset'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - performance
          - smoke
          - stress
      skip_coverage:
        description: 'Skip coverage upload'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Verbose test output'
        required: false
        default: false
        type: boolean

# Environment variables
env:
  NODE_ENV: test
  RAG_PACKAGE_DIR: a2a-client/packages/rag
  REPORTS_DIR: reports
  ACCURACY_THRESHOLD: 0.8
  PERF_THRESHOLD_MS: 100

jobs:
  # ========================================================================
  # Job: test
  # Run all tests with coverage on multiple Node.js versions
  # ========================================================================
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x']
    
    defaults:
      run:
        working-directory: ${{ env.RAG_PACKAGE_DIR }}
    
    steps:
      # ------------------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper test analysis
      
      # ------------------------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------------------------
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            a2a-client/package-lock.json
            a2a-client/packages/rag/package.json
      
      # ------------------------------------------------------------------------
      # Cache npm dependencies
      # ------------------------------------------------------------------------
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ env.RAG_PACKAGE_DIR }}/node_modules
            a2a-client/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-
      
      # ------------------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------------------
      - name: Install root dependencies
        run: |
          cd ../../
          npm ci
      
      - name: Install RAG package dependencies
        run: |
          npm ci
      
      # ------------------------------------------------------------------------
      # Build dependent packages
      # ------------------------------------------------------------------------
      - name: Build fs-utils package
        run: |
          cd ../fs-utils
          npm run build
      
      - name: Build embedding package
        run: |
          cd ../embedding
          npm run build
      
      # ------------------------------------------------------------------------
      # Generate test data
      # ------------------------------------------------------------------------
      - name: Generate test data
        run: |
          npx ts-node test-data/generator.ts --output ./test-data/output
        env:
          TEST_FILES_PER_TYPE: ${{ github.event.inputs.test_preset == 'smoke' && '3' || '10' }}
          TEST_AVG_FILE_SIZE: ${{ github.event.inputs.test_preset == 'smoke' && '50' || '100' }}
      
      # ------------------------------------------------------------------------
      # Run tests with coverage
      # ------------------------------------------------------------------------
      - name: Run tests
        run: |
          npm test -- \
            --coverage \
            --coverageDirectory=./coverage \
            --testPathPattern="(functional|edge-cases)" \
            --verbose=${{ github.event.inputs.verbose || 'false' }}
        env:
          TEST_PRESET: ${{ github.event.inputs.test_preset || 'default' }}
          CI: true
      
      # ------------------------------------------------------------------------
      # Upload coverage to Codecov
      # ------------------------------------------------------------------------
      - name: Upload coverage to Codecov
        if: ${{ !github.event.inputs.skip_coverage && matrix.node-version == '20.x' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: rag-tests
          name: rag-node-${{ matrix.node-version }}
          fail_ci_if_error: false
          verbose: true
      
      # ------------------------------------------------------------------------
      # Run RAG test runner and generate reports
      # ------------------------------------------------------------------------
      - name: Run RAG test runner
        run: |
          npx ts-node tests/runner-cli.ts \
            --preset ${{ github.event.inputs.test_preset || 'default' }} \
            --output ./${{ env.REPORTS_DIR }}
        env:
          THRESHOLD_ACCURACY: ${{ env.ACCURACY_THRESHOLD }}
          THRESHOLD_SEARCH_TIME_MS: ${{ env.PERF_THRESHOLD_MS }}
      
      # ------------------------------------------------------------------------
      # Generate reports
      # ------------------------------------------------------------------------
      - name: Generate test reports
        run: |
          npx ts-node tests/generate-reports.ts \
            --input ./${{ env.REPORTS_DIR }}/latest.json \
            --output ./${{ env.REPORTS_DIR }}
      
      # ------------------------------------------------------------------------
      # Upload test artifacts
      # ------------------------------------------------------------------------
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-test-reports-node-${{ matrix.node-version }}
          path: |
            ${{ env.RAG_PACKAGE_DIR }}/${{ env.REPORTS_DIR }}/
            ${{ env.RAG_PACKAGE_DIR }}/coverage/
            ${{ env.RAG_PACKAGE_DIR }}/test-data/output/
          retention-days: 30
      
      # ------------------------------------------------------------------------
      # Check accuracy threshold
      # ------------------------------------------------------------------------
      - name: Check accuracy threshold
        run: |
          npx ts-node tests/check-thresholds.ts \
            --input ./${{ env.REPORTS_DIR }}/latest.json \
            --accuracy ${{ env.ACCURACY_THRESHOLD }}
      
      # ------------------------------------------------------------------------
      # Check performance threshold
      # ------------------------------------------------------------------------
      - name: Check performance threshold
        run: |
          npx ts-node tests/check-thresholds.ts \
            --input ./${{ env.REPORTS_DIR }}/latest.json \
            --performance ${{ env.PERF_THRESHOLD_MS }}

  # ========================================================================
  # Job: performance
  # Dedicated performance testing with regression detection
  # ========================================================================
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    defaults:
      run:
        working-directory: ${{ env.RAG_PACKAGE_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            a2a-client/package-lock.json
            a2a-client/packages/rag/package.json
      
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ env.RAG_PACKAGE_DIR }}/node_modules
            a2a-client/node_modules
          key: ${{ runner.os }}-node-perf-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-perf-
      
      - name: Install dependencies
        run: |
          cd ../../
          npm ci
          cd packages/rag
          npm ci
      
      - name: Build dependent packages
        run: |
          cd ../fs-utils && npm run build
          cd ../embedding && npm run build
      
      # ------------------------------------------------------------------------
      # Download baseline results (from main branch)
      # ------------------------------------------------------------------------
      - name: Download baseline results
        id: baseline
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          branch: main
          workflow: rag-tests.yml
          name: rag-test-reports-node-20.x
          path: ./${{ env.REPORTS_DIR }}/baseline
          if_no_artifact_found: warn
      
      # ------------------------------------------------------------------------
      # Run performance tests
      # ------------------------------------------------------------------------
      - name: Run performance tests
        run: |
          npx ts-node tests/runner-cli.ts \
            --preset performance \
            --output ./${{ env.REPORTS_DIR }}
        env:
          PERF_THRESHOLD_SEARCH_MS: 50
          PERF_THRESHOLD_ACCURACY: 0.85
      
      # ------------------------------------------------------------------------
      # Compare with baseline
      # ------------------------------------------------------------------------
      - name: Compare with baseline
        id: compare
        run: |
          if [ -f "./${{ env.REPORTS_DIR }}/baseline/latest.json" ]; then
            npx ts-node tests/compare-baseline.ts \
              --current ./${{ env.REPORTS_DIR }}/latest.json \
              --baseline ./${{ env.REPORTS_DIR }}/baseline/latest.json \
              --output ./${{ env.REPORTS_DIR }}/comparison.md
            
            echo "has_baseline=true" >> $GITHUB_OUTPUT
          else
            echo "No baseline found - skipping comparison"
            echo "has_baseline=false" >> $GITHUB_OUTPUT
          fi
      
      # ------------------------------------------------------------------------
      # Check for performance regression
      # ------------------------------------------------------------------------
      - name: Check regression
        if: steps.compare.outputs.has_baseline == 'true'
        id: regression
        run: |
          npx ts-node tests/check-regression.ts \
            --comparison ./${{ env.REPORTS_DIR }}/comparison.md \
            --threshold 20
        continue-on-error: true
      
      # ------------------------------------------------------------------------
      # Upload performance artifacts
      # ------------------------------------------------------------------------
      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-performance-reports
          path: |
            ${{ env.RAG_PACKAGE_DIR }}/${{ env.REPORTS_DIR }}/
          retention-days: 90

  # ========================================================================
  # Job: report
  # Aggregate results and publish comprehensive report
  # ========================================================================
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [test, performance]
    if: always()
    
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ------------------------------------------------------------------------
      # Download all artifacts
      # ------------------------------------------------------------------------
      - name: Download Node 18 artifacts
        uses: actions/download-artifact@v4
        with:
          name: rag-test-reports-node-18.x
          path: ./reports/node-18
        continue-on-error: true
      
      - name: Download Node 20 artifacts
        uses: actions/download-artifact@v4
        with:
          name: rag-test-reports-node-20.x
          path: ./reports/node-20
        continue-on-error: true
      
      - name: Download performance artifacts
        uses: actions/download-artifact@v4
        with:
          name: rag-performance-reports
          path: ./reports/performance
        continue-on-error: true
      
      # ------------------------------------------------------------------------
      # Generate summary report
      # ------------------------------------------------------------------------
      - name: Generate summary report
        run: |
          cat > ./reports/SUMMARY.md << 'EOF'
          # RAG Test Results Summary
          
          ## Workflow Information
          - **Run**: ${{ github.run_id }}
          - **Event**: ${{ github.event_name }}
          - **Ref**: ${{ github.ref }}
          - **Commit**: ${{ github.sha }}
          
          ## Test Matrix Results
          EOF
          
          # Add Node 18 results
          if [ -f "./reports/node-18/latest.json" ]; then
            echo "" >> ./reports/SUMMARY.md
            echo "### Node 18.x" >> ./reports/SUMMARY.md
            cat ./reports/node-18/latest.md >> ./reports/SUMMARY.md || true
          fi
          
          # Add Node 20 results
          if [ -f "./reports/node-20/latest.json" ]; then
            echo "" >> ./reports/SUMMARY.md
            echo "### Node 20.x" >> ./reports/SUMMARY.md
            cat ./reports/node-20/latest.md >> ./reports/SUMMARY.md || true
          fi
          
          # Add performance comparison
          if [ -f "./reports/performance/comparison.md" ]; then
            echo "" >> ./reports/SUMMARY.md
            echo "## Performance Comparison" >> ./reports/SUMMARY.md
            cat ./reports/performance/comparison.md >> ./reports/SUMMARY.md
          fi
      
      # ------------------------------------------------------------------------
      # Comment on PR
      # ------------------------------------------------------------------------
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read test results
            let summary = '';
            let performanceAlert = '';
            
            try {
              const node20Report = JSON.parse(fs.readFileSync('./reports/node-20/latest.json', 'utf8'));
              const { summary: testSummary, performance, accuracy } = node20Report;
              
              // Determine status emoji
              const passRate = testSummary.passRate;
              const statusEmoji = passRate >= 0.8 ? '✅' : passRate >= 0.5 ? '⚠️' : '❌';
              
              summary = `## ${statusEmoji} RAG Test Results
              
              | Metric | Value |
              |--------|-------|
              | Total Tests | ${testSummary.total} |
              | Passed | ${testSummary.passed} |
              | Failed | ${testSummary.failed} |
              | Pass Rate | ${(passRate * 100).toFixed(1)}% |
              | Avg Search Time | ${performance.avgSearchTimeMs.toFixed(2)}ms |
              | Precision | ${(accuracy.precision * 100).toFixed(2)}% |
              | Recall | ${(accuracy.recall * 100).toFixed(2)}% |
              `;
              
              // Check for performance regression
              if (fs.existsSync('./reports/performance/comparison.md')) {
                const comparison = fs.readFileSync('./reports/performance/comparison.md', 'utf8');
                if (comparison.includes('REGRESSION')) {
                  performanceAlert = '\n\n⚠️ **Performance Regression Detected**\n\n' + 
                    'Some performance metrics have degraded compared to baseline. ' +
                    'Please review the detailed comparison in the workflow artifacts.';
                }
              }
              
              // Check thresholds
              if (accuracy.precision < 0.8) {
                summary += '\n\n❌ **Accuracy Below Threshold**: Precision is below 80%';
              }
              if (performance.avgSearchTimeMs > 100) {
                summary += '\n\n⚠️ **Performance Warning**: Average search time exceeds 100ms';
              }
              
            } catch (error) {
              summary = '## ❌ RAG Test Results\n\nFailed to parse test results. Please check the workflow logs.';
            }
            
            const body = summary + performanceAlert + 
              '\n\n📊 [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('RAG Test Results')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
      
      # ------------------------------------------------------------------------
      # Upload consolidated report
      # ------------------------------------------------------------------------
      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: rag-consolidated-report
          path: ./reports/
          retention-days: 90
      
      # ------------------------------------------------------------------------
      # Deploy to GitHub Pages (optional)
      # ------------------------------------------------------------------------
      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reports/
      
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

  # ========================================================================
  # Job: notify
  # Send notifications on failure
  # ========================================================================
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, performance, report]
    if: failure() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
    
    steps:
      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            ❌ RAG Tests Failed
            
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_id }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            
            View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
      
      - name: Create issue on scheduled failure
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 RAG Tests Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            ## Scheduled RAG Tests Failed
            
            - **Date**: ${new Date().toISOString()}
            - **Workflow Run**: ${{ github.run_id }}
            - **Commit**: ${{ github.sha }}
            
            Please investigate the test failures.
            
            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'automated', 'rag-tests']
            });
