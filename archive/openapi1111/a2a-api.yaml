openapi: 3.0.3
info:
  title: A2A Protocol API
  description: |
    API for A2A (Agent-to-Agent) protocol communication.
    
    ## Architecture
    - HTTP server: port 3000
    - Client API: port 3001
    - Web UI: port 5173
    
    ## Protocol
    All execute and result objects use **action-key shape**:
    ```json
    { "execute": { "script": { ... } } }
    { "result": { "script": { ... } } }
    ```
  version: 1.0.0
  contact:
    name: A2A Protocol Team

servers:
  - url: http://localhost:3000
    description: A2A Server (HTTP)
  - url: http://localhost:3001
    description: A2A Client API
  - url: http://localhost:5173
    description: Web UI

tags:
  - name: requests
    description: Main request/response endpoints
  - name: actions
    description: Action execution endpoints
  - name: sse
    description: Server-Sent Events streaming
  - name: auth
    description: Authentication endpoints

paths:
  /requests:
    post:
      tags:
        - requests
      summary: Submit A2A request
      description: |
        Submit a new request to the A2A server.
        
        **Initial Request** (first request):
        ```json
        { "task": "виправити імпорти у vue компонентах" }
        ```
        
        **Follow-up Request** (subsequent requests):
        ```json
        {
          "context": { ... },
          "result": { "script": { ... } }
        }
        ```
      operationId: submitRequest
      requestBody:
        description: A2A Request object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
            examples:
              initial_request:
                summary: Initial request
                value:
                  task: виправити імпорти у vue компонентах
              followup_request:
                summary: Follow-up request with context
                value:
                  context:
                    task: виправити імпорти у vue компонентах
                    execution:
                      action: fix-vue-imports
                      step: vue-import-detect
                  result:
                    script:
                      broken_imports:
                        - file: resources/js/Pages/Auth/Login.vue
                          line: 3
                          import: import Header from '../components/Header'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                form_response:
                  summary: Form response
                  value:
                    context:
                      task: виправити імпорти у vue компонентах
                    execute:
                      form:
                        title: Оберіть спосіб виконання
                        choices:
                          - id: fix-vue-imports
                            label: Виправити зламані імпорти
                          - id: auto-ai
                            label: AI Action Generator
                script_response:
                  summary: Script execution response
                  value:
                    context:
                      task: виправити імпорти у vue компонентах
                      execution:
                        action: fix-vue-imports
                        step: vue-import-resolve
                    execute:
                      script:
                        input:
                          broken_imports: []
                        output: patches[]
                        code: // script code here
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /actions/execute:
    post:
      tags:
        - actions
      summary: Execute action directly
      description: Execute a specific action without full request context
      operationId: executeAction
      requestBody:
        description: Action execute object (action-key shape)
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - $ref: '#/components/schemas/FormExecute'
                - $ref: '#/components/schemas/ScriptExecute'
                - $ref: '#/components/schemas/ReadFileExecute'
                - $ref: '#/components/schemas/WriteFileExecute'
                - $ref: '#/components/schemas/RagSearchExecute'
                - $ref: '#/components/schemas/ExecuteCommandExecute'
            example:
              script:
                code: console.log('Hello, World!')
                input: {}
                output: string
      responses:
        '200':
          description: Action execution result
          content:
            application/json:
              schema:
                type: object
                oneOf:
                  - $ref: '#/components/schemas/FormResult'
                  - $ref: '#/components/schemas/ScriptResult'
                  - $ref: '#/components/schemas/ReadFileResult'
                  - $ref: '#/components/schemas/WriteFileResult'
                  - $ref: '#/components/schemas/RagSearchResult'
                  - $ref: '#/components/schemas/ExecuteCommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sse:
    get:
      tags:
        - sse
      summary: Stream events via Server-Sent Events
      description: |
        Open a SSE connection to receive real-time event updates.
        
        Events include:
        - action progress updates
        - execution state changes
        - error notifications
      operationId: streamEvents
      parameters:
        - name: sessionId
          in: query
          description: Session identifier for the stream
          required: true
          schema:
            type: string
            format: uuid
        - name: lastEventId
          in: query
          description: Last event ID for reconnection
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE stream established
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              schema:
                type: string
                example: no-cache
            Connection:
              schema:
                type: string
                example: keep-alive
          content:
            text/event-stream:
              schema:
                type: string
                format: event-stream
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags:
        - auth
      summary: User login
      description: Authenticate user and receive JWT token
      operationId: login
      requestBody:
        description: Login credentials
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Username or email
                password:
                  type: string
                  format: password
                  description: User password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - auth
      summary: User logout
      description: Invalidate current session/token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful

  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh token
      description: Refresh JWT token with new expiration
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ==================== Base Types ====================
    Message:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [user, assistant, system]
          description: Role of the message sender
        content:
          type: string
          description: Message content text
        name:
          type: string
          description: Optional name identifier

    ExecutionState:
      type: object
      required:
        - action
        - step
      properties:
        action:
          type: string
          description: Current action identifier
        step:
          type: string
          description: Current step within the action
        progress:
          type: object
          properties:
            current:
              type: number
            total:
              type: number
            message:
              type: string

    Context:
      type: object
      properties:
        task:
          type: string
        execution:
          $ref: '#/components/schemas/ExecutionState'
        history:
          type: array
          items:
            type: object
        workbench:
          type: object
          additionalProperties: true
        aliases:
          type: object
          additionalProperties:
            type: string

    # ==================== Action Execute Types ====================
    FormChoice:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        value:
          type: string

    FormInput:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          type: string
          enum: [text, textarea, select, checkbox, radio, number, file]
        label:
          type: string
        placeholder:
          type: string
        required:
          type: boolean
        options:
          type: array
          items:
            type: object

    FormExecute:
      type: object
      properties:
        form:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            choices:
              type: array
              items:
                $ref: '#/components/schemas/FormChoice'
            input:
              type: array
              items:
                $ref: '#/components/schemas/FormInput'

    ScriptExecute:
      type: object
      properties:
        script:
          type: object
          required:
            - code
          properties:
            input:
              type: object
            output:
              type: string
            code:
              type: string

    ReadFileExecute:
      type: object
      properties:
        read-file:
          type: object
          required:
            - path
          properties:
            path:
              type: string
            encoding:
              type: string

    WriteFileExecute:
      type: object
      properties:
        write-file:
          type: object
          required:
            - path
            - content
          properties:
            path:
              type: string
            content:
              type: string
            encoding:
              type: string

    RagSearchExecute:
      type: object
      properties:
        rag-search:
          type: object
          required:
            - query
          properties:
            query:
              type: string
            top_k:
              type: number

    ExecuteCommandExecute:
      type: object
      properties:
        execute-command:
          type: object
          required:
            - command
          properties:
            command:
              type: string
            cwd:
              type: string
            timeout:
              type: number

    MessageExecute:
      type: object
      properties:
        message:
          type: string

    # ==================== Action Result Types ====================
    FormResult:
      type: object
      properties:
        form:
          type: object
          properties:
            choice:
              type: string
            message:
              type: string
            input:
              type: object

    ScriptResult:
      type: object
      properties:
        script:
          type: object
          properties:
            output:
              type: [string, object, array]
            error:
              type: string

    ReadFileResult:
      type: object
      properties:
        read-file:
          type: object
          required:
            - path
          properties:
            path:
              type: string
            content:
              type: string
            error:
              type: string

    WriteFileResult:
      type: object
      properties:
        write-file:
          type: object
          required:
            - path
          properties:
            path:
              type: string
            success:
              type: boolean
            error:
              type: string

    RagSearchResult:
      type: object
      properties:
        rag-search:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
            files:
              type: array
              items:
                type: string
            query:
              type: string

    ExecuteCommandResult:
      type: object
      properties:
        execute-command:
          type: object
          required:
            - command
          properties:
            command:
              type: string
            exitCode:
              type: number
            stdout:
              type: string
            stderr:
              type: string

    # ==================== Action/Step Definitions ====================
    Action:
      type: object
      required:
        - action
        - title
        - description
      properties:
        action:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: number
        matchScore:
          type: number
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        repeatSteps:
          type: array
          items:
            type: string

    Step:
      type: object
      required:
        - action
        - title
        - description
      properties:
        action:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: number
        input:
          type: object
        output:
          type: object

    FallbackAction:
      type: object
      required:
        - mode
        - title
        - description
      properties:
        mode:
          type: string
          enum: [auto-ai, task-decomposition]
        title:
          type: string
        description:
          type: string
        fallbackType:
          type: string
          enum: [llm_generation, manual]

    # ==================== Request/Response ====================
    Request:
      oneOf:
        - type: object
          required:
            - task
          properties:
            task:
              type: string
        - type: object
          required:
            - context
          properties:
            context:
              $ref: '#/components/schemas/Context'
            result:
              type: object
            input:
              type: object

    Response:
      type: object
      required:
        - context
      properties:
        context:
          $ref: '#/components/schemas/Context'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        aiActions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        fallbackActions:
          type: array
          items:
            $ref: '#/components/schemas/FallbackAction'
        execute:
          type: object
        result:
          type: object
        assistantMessage:
          $ref: '#/components/schemas/Message'

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: Invalid request format

    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred
